<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>AI Pro Coder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* ============================================================
           Reset & Tokens
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --surface-hover: #333537;
            --surface-elev: #282a2c;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --text-muted: #8a8d8e;
            --accent-blue: #a8c7fa;
            --accent-blue-bg: rgba(168, 199, 250, 0.15);
            --accent-green: #81c995;
            --accent-red: #f28b82;
            --accent-yellow: #fdd663;
            --border-color: #444746;
            --border-soft: #2c2e30;
            --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           Header
           ============================================================ */
        header {
            background-color: rgba(19, 19, 20, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
            position: sticky;
            top: 0;
            padding-top: calc(env(safe-area-inset-top, 16px) + 8px);
        }
        .header-title { flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        #model-select {
            appearance: none; -webkit-appearance: none;
            background-color: transparent; border: none;
            padding: 8px 32px 8px 12px;
            font-size: 1.15rem; font-family: var(--font-main); font-weight: 500;
            color: var(--text-secondary); cursor: pointer; outline: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c4c7c5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 8px center; background-size: 18px;
            border-radius: 8px; max-width: 250px;
            text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
        }
        #model-select:hover { background-color: var(--surface-color); color: var(--text-primary); }
        #model-select option { background-color: var(--surface-color); color: var(--text-primary); }

        .header-btn {
            background: transparent; color: var(--text-secondary); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 8px; border-radius: 50%; transition: background-color 0.2s;
        }
        .header-btn:hover { background-color: var(--surface-color); color: var(--text-primary); }

        /* ============================================================
           Sidebar (Recent + Snippets tabs)
           ============================================================ */
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; opacity: 0; transition: opacity 0.3s ease; }
        #sidebar {
            position: fixed; left: -320px; top: 0; width: 300px; height: 100dvh;
            background: var(--surface-color); z-index: 200;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            border-top-right-radius: 16px; border-bottom-right-radius: 16px;
            box-shadow: 2px 0 12px rgba(0,0,0,0.5);
        }
        #sidebar.open { left: 0; }
        .sidebar-header {
            padding: 16px 20px 0;
            padding-top: calc(env(safe-area-inset-top, 16px) + 16px);
            display: flex; flex-direction: column; gap: 12px;
        }
        .sidebar-title { font-weight: 500; font-size: 1.1rem; }
        .sidebar-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-color); }
        .sidebar-tab {
            background: transparent; border: none; color: var(--text-secondary);
            padding: 10px 16px; cursor: pointer; font-family: var(--font-main);
            font-size: 0.95rem; font-weight: 500; position: relative; transition: color 0.2s;
        }
        .sidebar-tab:hover { color: var(--text-primary); }
        .sidebar-tab.active { color: var(--accent-blue); }
        .sidebar-tab.active::after {
            content: ''; position: absolute; bottom: -1px; left: 12px; right: 12px;
            height: 2px; background: var(--accent-blue); border-radius: 2px;
        }

        #chat-list, #snippet-list { flex-grow: 1; overflow-y: auto; padding: 12px; }
        #snippet-list { display: none; }

        .chat-item { padding: 12px 16px; margin-bottom: 6px; border-radius: 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .chat-item:hover { background-color: var(--surface-hover); }
        .chat-item.active { background-color: var(--accent-blue-bg); color: var(--accent-blue); font-weight: 500; }
        .chat-title { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; padding-right: 8px; display: flex; align-items: center; }
        .chat-delete { background: none; border: none; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .chat-delete:hover { background-color: rgba(255,255,255,0.1); color: var(--accent-red); }

        .snippet-item { padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; background: var(--surface-elev); cursor: pointer; transition: background 0.2s; border: 1px solid var(--border-soft); }
        .snippet-item:hover { background-color: var(--surface-hover); border-color: var(--border-color); }
        .snippet-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .snippet-lang { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-blue); background: var(--accent-blue-bg); padding: 2px 8px; border-radius: 6px; }
        .snippet-date { font-size: 0.72rem; color: var(--text-muted); }
        .snippet-preview { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
        .snippet-actions { display: flex; gap: 4px; margin-top: 8px; }
        .snippet-action-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 4px 10px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-family: var(--font-main); transition: all 0.2s; }
        .snippet-action-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
        .snippet-action-btn.danger:hover { color: var(--accent-red); border-color: var(--accent-red); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }

        /* ============================================================
           Chat UI
           ============================================================ */
        #chat-wrapper { flex: 1 1 auto; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        #chat-container {
            flex: 1 1 auto;
            overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column;
            padding: 20px 16px 160px;
            -webkit-overflow-scrolling: touch;
            max-width: 850px; margin: 0 auto;
            width: 100%;
            scroll-behavior: smooth;
        }

        .welcome-screen { text-align: center; margin-top: 22vh; display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.8s ease; }
        .welcome-title { font-size: 2.2rem; font-weight: 400; letter-spacing: -0.01em; color: #e3e3e3; margin-top: 16px; line-height: 1.3; }
        .welcome-subtitle { font-size: 1.05rem; color: var(--text-secondary); margin-top: 12px; max-width: 480px; line-height: 1.5; }

        .message-row { display: flex; width: 100%; margin-bottom: 28px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .user-row { justify-content: flex-end; flex-direction: column; align-items: flex-end; gap: 6px; }
        .user-message {
            background-color: var(--surface-color); color: var(--text-primary);
            border-radius: 24px; padding: 14px 20px;
            font-size: 1.05rem; line-height: 1.5;
            max-width: 85%; white-space: pre-wrap; word-break: break-word;
            position: relative;
        }
        .user-row .msg-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; padding-right: 8px; }
        .user-row:hover .msg-actions, .user-row:focus-within .msg-actions { opacity: 1; }

        .bot-row { justify-content: flex-start; align-items: flex-start; gap: 16px; flex-direction: row; }
        .bot-avatar {
            flex-shrink: 0; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            margin-top: 2px;
        }
        .bot-content { width: 100%; max-width: calc(100% - 48px); }
        .bot-message {
            color: var(--text-primary);
            font-size: 1.05rem; line-height: 1.65; word-break: break-word;
        }
        .bot-content .msg-actions { display: flex; gap: 4px; margin-top: 10px; opacity: 0.55; transition: opacity 0.2s; }
        .bot-content:hover .msg-actions { opacity: 1; }

        .msg-action-btn {
            background: transparent; border: none; color: var(--text-secondary);
            padding: 6px 10px; border-radius: 8px; font-size: 0.82rem;
            font-family: var(--font-main); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
            transition: all 0.2s;
        }
        .msg-action-btn:hover { background: var(--surface-color); color: var(--text-primary); }
        .msg-action-btn svg { width: 14px; height: 14px; }
        .msg-action-btn.copied { color: var(--accent-green); }

        .bot-message p { margin-bottom: 14px; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin-left: 20px; margin-bottom: 14px; }
        .bot-message li { margin-bottom: 6px; }
        .bot-message strong { font-weight: 600; color: #ffffff; }
        .bot-message > h1, .bot-message > h2, .bot-message > h3 { margin: 18px 0 10px; font-weight: 600; }
        .bot-message > h1 { font-size: 1.4rem; }
        .bot-message > h2 { font-size: 1.25rem; }
        .bot-message > h3 { font-size: 1.1rem; }
        .bot-message code:not(.hljs) {
            font-family: var(--font-mono);
            background-color: var(--surface-color);
            padding: 3px 6px; border-radius: 6px;
            font-size: 0.88em; color: var(--accent-blue);
        }
        .bot-message blockquote { border-left: 3px solid var(--accent-blue); padding-left: 14px; margin: 12px 0; color: var(--text-secondary); }
        .bot-message hr { border: none; border-top: 1px solid var(--border-color); margin: 18px 0; }

        /* Streaming caret */
        .stream-caret {
            display: inline-block; width: 8px; height: 1.05em;
            background: var(--accent-blue); margin-left: 2px;
            vertical-align: text-bottom; border-radius: 2px;
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ============================================================
           Code Blocks (enhanced)
           ============================================================ */
        .code-wrapper {
            margin: 16px 0; border-radius: 12px; overflow: hidden;
            background-color: #1e1f20; border: 1px solid var(--border-color);
        }
        .code-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--surface-elev); padding: 8px 12px 8px 16px;
            gap: 8px;
        }
        .code-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .lang-label { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
        .code-meta { color: var(--text-muted); font-size: 0.72rem; font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .code-streaming-badge {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.7rem; color: var(--accent-blue); font-weight: 500;
            padding: 2px 8px; border-radius: 10px; background: var(--accent-blue-bg);
        }
        .code-streaming-badge .dot { width: 6px; height: 6px; background: var(--accent-blue); border-radius: 50%; animation: pulse 1.2s infinite ease-in-out; }

        .btn-group { display: flex; gap: 4px; flex-shrink: 0; }
        .code-btn {
            background-color: transparent; border: none; color: var(--text-secondary);
            border-radius: 6px; padding: 6px 8px; font-size: 0.78rem;
            font-family: var(--font-main); cursor: pointer; transition: all 0.2s;
            font-weight: 500; display: inline-flex; align-items: center; gap: 4px;
        }
        .code-btn:hover { background-color: rgba(255,255,255,0.07); color: var(--text-primary); }
        .code-btn svg { width: 14px; height: 14px; }
        .code-btn.copy-btn.copied { color: var(--accent-green); }
        .code-btn.saved { color: var(--accent-yellow); }
        .code-btn.preview-btn { color: var(--accent-blue); }

        .code-body { display: flex; max-height: 480px; overflow: auto; }
        .code-body.wrap { white-space: pre-wrap; }
        .code-body.wrap .code-content { white-space: pre-wrap; word-break: break-word; }
        .code-body.expanded { max-height: none; }

        .line-numbers {
            flex-shrink: 0; padding: 16px 0 16px 14px;
            font-family: var(--font-mono); font-size: 0.88rem;
            line-height: 1.55; text-align: right;
            color: var(--text-muted); user-select: none;
            border-right: 1px solid var(--border-soft);
            background-color: rgba(0,0,0,0.15);
            min-width: 44px;
        }
        .line-numbers span { display: block; padding: 0 10px 0 6px; }

        .code-content-wrap { flex: 1; min-width: 0; overflow-x: auto; }
        .bot-message pre.code-content {
            margin: 0; padding: 16px;
            font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.55;
        }
        .bot-message pre.code-content code { background-color: transparent; padding: 0; color: #e3e3e3; }

        .bot-message table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 14px 0; }
        .bot-message th, .bot-message td { border: 1px solid var(--border-color); padding: 8px 12px; }
        .bot-message th { background: var(--surface-color); font-weight: 600; }
        .bot-message img { max-width: 100%; height: auto; border-radius: 12px; margin-top: 12px; border: 1px solid var(--border-color); }

        /* ============================================================
           Input Area
           ============================================================ */
        #input-wrapper {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(19,19,20,1) 50%, rgba(19,19,20,0));
            padding: 16px;
            padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 24px);
            display: flex; justify-content: center; pointer-events: none; z-index: 50;
        }
        #input-area {
            background-color: var(--surface-color);
            border-radius: 32px;
            width: 100%; max-width: 820px;
            padding: 8px 8px 8px 16px;
            display: flex; gap: 8px; align-items: flex-end;
            pointer-events: auto;
            transition: background-color 0.3s;
        }
        #input-area:focus-within { background-color: var(--surface-elev); }
        #user-input {
            flex: 1 1 auto; min-width: 0; min-height: 48px; max-height: 160px;
            padding: 12px 0; border: none; background: transparent;
            font-size: 1.1rem; line-height: 1.4; outline: none; resize: none;
            overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere;
            color: var(--text-primary); font-family: var(--font-main);
        }
        #user-input::placeholder { color: var(--text-secondary); opacity: 0.9; }

        .icon-btn {
            background-color: transparent; color: var(--text-secondary); border: none;
            width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; border-radius: 50%; transition: background 0.2s;
        }
        .icon-btn:hover { background-color: rgba(255,255,255,0.05); color: var(--text-primary); }

        .send-btn {
            background-color: transparent; color: var(--text-secondary); border: none;
            border-radius: 50%; width: 48px; height: 48px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
        }
        .send-btn.active { color: var(--bg-color); background-color: #e3e3e3; }
        .send-btn:disabled { color: #555; background-color: transparent; cursor: not-allowed; }

        .stop-btn {
            background-color: var(--accent-red); color: #131314; border: none;
            border-radius: 50%; width: 48px; height: 48px; cursor: pointer;
            display: none; align-items: center; justify-content: center; flex-shrink: 0;
            transition: all 0.2s;
        }
        .stop-btn.visible { display: flex; }
        .stop-btn:hover { transform: scale(1.05); }

        #file-upload { opacity: 0; position: absolute; z-index: -1; width: 1px; height: 1px; }

        /* ============================================================
           Utilities
           ============================================================ */
        .typing { display: flex; gap: 4px; padding: 12px 0; align-items: center; }
        .typing span { width: 6px; height: 6px; background: var(--accent-blue); border-radius: 50%; animation: pulse 1.5s infinite ease-in-out; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.4; } 50% { transform: scale(1.2); opacity: 1; } }

        #attachment-preview {
            background-color: var(--surface-color); padding: 10px 16px; font-size: 0.95rem;
            color: var(--text-primary); display: none; align-items: center;
            justify-content: space-between; border-radius: 16px; margin: 0 16px 12px;
            pointer-events: auto; font-weight: 500;
        }
        #attachment-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 8px; }
        .remove-attachment { color: var(--text-secondary); cursor: pointer; padding: 4px; border-radius: 50%; display: flex; }
        .remove-attachment:hover { background-color: rgba(255,255,255,0.05); color: var(--text-primary); }

        #toast {
            visibility: hidden; min-width: 250px; background-color: var(--text-primary); color: var(--bg-color);
            text-align: center; border-radius: 8px; padding: 12px 24px; position: fixed;
            z-index: 1000; left: 50%; top: 20px; transform: translateX(-50%); font-size: 0.95rem; font-weight: 500;
            opacity: 0; transition: opacity 0.3s, top 0.3s, visibility 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; top: 80px; }

        /* ============================================================
           Modals (Canvas Preview + Code Viewer + Edit Message)
           ============================================================ */
        .modal {
            display: none; position: fixed; inset: 0;
            background: var(--bg-color); z-index: 300; flex-direction: column;
        }
        .modal.open { display: flex; }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--surface-color);
            padding-top: calc(env(safe-area-inset-top, 16px) + 12px);
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }
        .modal-title { font-weight: 500; font-size: 1.05rem; color: var(--text-primary); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal-header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .modal-btn {
            background: transparent; color: var(--text-primary);
            border: 1px solid var(--border-color); padding: 6px 14px;
            border-radius: 16px; cursor: pointer; font-weight: 500;
            font-family: var(--font-main); transition: background 0.2s;
            font-size: 0.88rem; display: inline-flex; align-items: center; gap: 4px;
        }
        .modal-btn:hover { background: var(--surface-hover); }
        .modal-btn.primary { background: var(--accent-blue); color: var(--bg-color); border-color: var(--accent-blue); }
        .modal-btn.primary:hover { background: #b6d0fb; }

        #canvas-iframe { flex-grow: 1; border: none; width: 100%; background: #ffffff; }

        #code-modal-body {
            flex: 1; overflow: auto; background: var(--bg-color);
            padding: 0; display: flex;
        }
        #code-modal-numbers {
            flex-shrink: 0; padding: 20px 14px 20px 18px;
            font-family: var(--font-mono); font-size: 0.95rem; line-height: 1.6;
            text-align: right; color: var(--text-muted); user-select: none;
            border-right: 1px solid var(--border-soft);
            background-color: rgba(0,0,0,0.2);
        }
        #code-modal-numbers span { display: block; }
        #code-modal-pre {
            margin: 0; padding: 20px; flex: 1;
            font-family: var(--font-mono); font-size: 0.95rem; line-height: 1.6;
            overflow-x: auto;
        }
        #code-modal-pre.wrap { white-space: pre-wrap; word-break: break-word; }
        #code-modal-pre code { background: transparent; padding: 0; }

        #edit-modal-body { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; margin: 0 auto; width: 100%; }
        #edit-textarea {
            width: 100%; flex: 1; min-height: 200px;
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; color: var(--text-primary);
            font-family: var(--font-main); font-size: 1.05rem; line-height: 1.5; outline: none;
            resize: none;
        }
        #edit-textarea:focus { border-color: var(--accent-blue); }
        .edit-hint { color: var(--text-muted); font-size: 0.85rem; padding: 0 4px; }

        @media (max-width: 600px) {
            .line-numbers { min-width: 36px; padding-left: 8px; }
            .line-numbers span { padding: 0 6px 0 4px; }
            .bot-message pre.code-content { padding: 14px; font-size: 0.82rem; }
            .code-header { padding: 8px 10px 8px 12px; }
            .code-meta { display: none; }
            .code-btn { padding: 6px; }
            .code-btn .btn-label { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <button class="header-btn" onclick="toggleSidebar()" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="header-title">
            <select id="model-select" onchange="changeModel()">
                <option value="">Loading models...</option>
            </select>
        </div>
        <button class="header-btn" onclick="startNewChat()" aria-label="New Chat">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
    </header>

    <div id="toast">Model switched!</div>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Workspace</div>
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" data-tab="chats" onclick="switchSidebarTab('chats')">Recent</button>
                <button class="sidebar-tab" data-tab="snippets" onclick="switchSidebarTab('snippets')">Snippets</button>
            </div>
        </div>
        <div id="chat-list"></div>
        <div id="snippet-list"></div>
    </div>

    <div id="chat-wrapper">
        <div id="chat-container"></div>

        <div id="input-wrapper">
            <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column;">

                <div id="attachment-preview">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    <span id="attachment-name">filename.txt</span>
                    <div class="remove-attachment" onclick="clearAttachment()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </div>
                </div>

                <div id="input-area">
                    <label class="icon-btn" for="file-upload" aria-label="Attach file">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </label>

                    <input type="file" id="file-upload" multiple>

                    <textarea id="user-input" placeholder="Ask AI Pro Coder" autocomplete="off" rows="1"></textarea>

                    <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="Send">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: translateX(1px);"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                    <button class="stop-btn" id="stop-btn" onclick="stopGeneration()" aria-label="Stop generation">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas Preview Modal -->
    <div id="canvas-modal" class="modal">
        <div class="modal-header">
            <span class="modal-title">Live Preview</span>
            <div class="modal-header-actions">
                <button class="modal-btn" onclick="closeCanvas()">Close</button>
            </div>
        </div>
        <iframe id="canvas-iframe"></iframe>
    </div>

    <!-- Fullscreen Code Modal -->
    <div id="code-modal" class="modal">
        <div class="modal-header">
            <span class="modal-title" id="code-modal-title">Code</span>
            <div class="modal-header-actions">
                <button class="modal-btn" onclick="toggleCodeModalWrap()" id="code-modal-wrap-btn">Wrap</button>
                <button class="modal-btn" onclick="copyCodeModal()" id="code-modal-copy-btn">Copy</button>
                <button class="modal-btn" onclick="downloadCodeModal()">Download</button>
                <button class="modal-btn" onclick="closeCodeModal()">Close</button>
            </div>
        </div>
        <div id="code-modal-body">
            <div id="code-modal-numbers"></div>
            <pre id="code-modal-pre"><code id="code-modal-code"></code></pre>
        </div>
    </div>

    <!-- Edit Message Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-header">
            <span class="modal-title">Edit message</span>
            <div class="modal-header-actions">
                <button class="modal-btn" onclick="closeEditModal()">Cancel</button>
                <button class="modal-btn primary" onclick="submitEditModal()">Resend</button>
            </div>
        </div>
        <div id="edit-modal-body">
            <textarea id="edit-textarea" placeholder="Edit your message..."></textarea>
            <div class="edit-hint">Saving will resend from this point. The bot's previous reply (and anything after) will be discarded.</div>
        </div>
    </div>

    <script>
        /* ============================================================
           Configuration
           ============================================================ */
        const API_BASE_URL = 'https://aiproxy.th3va.com';
        const VPS_OLLAMA_URL = `${API_BASE_URL}/api/chat`;
        const VPS_OLLAMA_TAGS_URL = `${API_BASE_URL}/api/tags`;

        const STORAGE_MODEL_KEY = 'aiproxy_selected_model';
        const STORAGE_CONVERSATIONS_KEY = 'aiproxy_conversations';
        const STORAGE_SNIPPETS_KEY = 'aiproxy_snippets';

        const SYSTEM_PROMPT = `
You are AI Pro Coder, an elite senior software engineer and AI architect.
Rules:
- Always provide production-grade solutions
- Never give incomplete code
- Generate full working scripts when requested
- Prefer clean architecture, mobile responsiveness, and performance
- When generating HTML/CSS/JS, provide complete standalone files
- Explain fixes clearly and briefly
`;

        const LANG_EXTENSIONS = {
            javascript: 'js', js: 'js', typescript: 'ts', ts: 'ts', jsx: 'jsx', tsx: 'tsx',
            python: 'py', py: 'py', html: 'html', xml: 'xml', css: 'css', scss: 'scss',
            json: 'json', bash: 'sh', shell: 'sh', sh: 'sh', zsh: 'sh',
            java: 'java', cpp: 'cpp', c: 'c', csharp: 'cs', cs: 'cs',
            go: 'go', rust: 'rs', rs: 'rs', php: 'php', ruby: 'rb', rb: 'rb',
            sql: 'sql', yaml: 'yml', yml: 'yml', markdown: 'md', md: 'md',
            vue: 'vue', svelte: 'svelte', dart: 'dart', kotlin: 'kt', swift: 'swift',
            dockerfile: 'Dockerfile', toml: 'toml', ini: 'ini', plaintext: 'txt'
        };

        const BOT_AVATAR_SVG = `
            <div class="bot-avatar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="url(#sparkle-grad)" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4285f4"/><stop offset="50%" stop-color="#d96570"/><stop offset="100%" stop-color="#f4b400"/></linearGradient></defs>
                    <path d="M12.0001 22.5001C11.854 22.5001 11.7161 22.4276 11.6366 22.3023C9.9392 19.5898 7.64998 17.3006 4.93751 15.6032C4.81223 15.5237 4.73975 15.3858 4.73975 15.2397V15.2397C4.73975 15.0936 4.81223 14.9557 4.93751 14.8762C7.64998 13.1788 9.9392 10.8896 11.6366 8.17714C11.7161 8.05185 11.854 7.97937 12.0001 7.97937V7.97937C12.1462 7.97937 12.284 8.05185 12.3636 8.17714C14.061 10.8896 16.3502 13.1788 19.0627 14.8762C19.188 14.9557 19.2604 15.0936 19.2604 15.2397V15.2397C19.2604 15.3858 19.188 15.5237 19.0627 15.6032C16.3502 17.3006 14.061 19.5898 12.3636 22.3023C12.284 22.4276 12.1462 22.5001 12.0001 22.5001V22.5001Z"/>
                </svg>
            </div>`;

        /* ============================================================
           State
           ============================================================ */
        let AVAILABLE_MODELS = {};
        let currentModel = '';
        let conversations = [];
        let snippets = [];
        let currentChatId = null;
        let chatContext = [];
        let toastTimeout = null;
        let isWaitingForReply = false;
        let currentStreamController = null;
        let currentBotContent = null;       // the .bot-content wrapper for the in-flight response
        let currentBotMessageDiv = null;    // the .bot-message inside it
        let editingMessageIndex = null;
        let codeModalState = { code: '', lang: 'plaintext', wrap: false };

        /* ============================================================
           Boot
           ============================================================ */
        window.onload = async function() {
            loadSnippets();
            await loadActiveModelsFromServer();
            const savedConversations = localStorage.getItem(STORAGE_CONVERSATIONS_KEY);
            if (savedConversations) {
                try { conversations = JSON.parse(savedConversations) || []; } catch (e) { conversations = []; }
            }
            if (conversations.length > 0) loadChat(conversations[0].id);
            else startNewChat();
            renderSnippetList();
        };

        /* ============================================================
           Model loading
           ============================================================ */
        function formatModelLabel(modelName) {
            return String(modelName || '')
                .replace(/:cloud$/i, ' Cloud')
                .replace(/:latest$/i, ' Latest')
                .replace(/-/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase())
                .trim();
        }

        function populateModelDropdown(modelsMap) {
            const modelSelect = document.getElementById('model-select');
            modelSelect.innerHTML = '';
            const modelEntries = Object.entries(modelsMap);
            if (modelEntries.length === 0) {
                modelSelect.innerHTML = '<option value="">No models found</option>';
                currentModel = '';
                return;
            }
            modelEntries.forEach(([modelId, label]) => {
                const option = document.createElement('option');
                option.value = modelId;
                option.textContent = label;
                modelSelect.appendChild(option);
            });
            const savedModel = localStorage.getItem(STORAGE_MODEL_KEY);
            if (savedModel && modelsMap[savedModel]) {
                currentModel = savedModel;
            } else if (!currentModel || !modelsMap[currentModel]) {
                currentModel = modelEntries[0][0];
                localStorage.setItem(STORAGE_MODEL_KEY, currentModel);
            }
            modelSelect.value = currentModel;
        }

        async function loadActiveModelsFromServer() {
            const modelSelect = document.getElementById('model-select');
            modelSelect.innerHTML = '<option value="">Loading models...</option>';
            modelSelect.disabled = true;
            currentModel = '';
            const requestUrl = `${VPS_OLLAMA_TAGS_URL}?t=${Date.now()}`;
            try {
                const response = await fetch(requestUrl, { method: 'GET', mode: 'cors', headers: { 'Accept': 'application/json' }, cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const serverModels = Array.isArray(data.models) ? data.models : [];
                const activeModels = {};
                serverModels.forEach(item => {
                    const modelId = item.name || item.model;
                    if (modelId) activeModels[modelId] = formatModelLabel(modelId);
                });
                if (Object.keys(activeModels).length === 0) throw new Error('No models returned');
                AVAILABLE_MODELS = activeModels;
                populateModelDropdown(AVAILABLE_MODELS);
                modelSelect.disabled = false;
            } catch (error) {
                console.error('Model loading failed:', error);
                AVAILABLE_MODELS = {};
                currentModel = '';
                localStorage.removeItem(STORAGE_MODEL_KEY);
                modelSelect.innerHTML = `<option value="">Unable to load models</option><option value="__retry__">Retry</option>`;
                modelSelect.disabled = false;
                showToast('Unable to load models from VPS');
            }
        }

        function changeModel() {
            currentModel = document.getElementById('model-select').value;
            if (currentModel === '__retry__') { loadActiveModelsFromServer(); return; }
            if (!currentModel) { localStorage.removeItem(STORAGE_MODEL_KEY); return; }
            localStorage.setItem(STORAGE_MODEL_KEY, currentModel);
            const modelName = AVAILABLE_MODELS[currentModel] || currentModel;
            showToast(`Switched to ${modelName}`);
        }

        /* ============================================================
           UI helpers
           ============================================================ */
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);
            } else {
                sidebar.classList.add('open');
                overlay.style.display = 'block';
                setTimeout(() => overlay.style.opacity = '1', 10);
            }
        }

        function switchSidebarTab(tab) {
            document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.getElementById('chat-list').style.display = tab === 'chats' ? 'block' : 'none';
            document.getElementById('snippet-list').style.display = tab === 'snippets' ? 'block' : 'none';
        }

        function escapeHtml(value) {
            return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        /* ============================================================
           Sidebar rendering
           ============================================================ */
        function renderSidebar() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            if (conversations.length === 0) {
                list.innerHTML = '<div class="empty-state">No conversations yet.<br>Ask AI Pro Coder something to get started.</div>';
                return;
            }
            conversations.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.onclick = () => loadChat(chat.id);
                div.innerHTML = `
                    <div class="chat-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 6px; opacity: 0.7; flex-shrink:0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(chat.title)}</span>
                    </div>
                    <button class="chat-delete" onclick="deleteChat('${chat.id}', event)" aria-label="Delete chat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function renderSnippetList() {
            const list = document.getElementById('snippet-list');
            list.innerHTML = '';
            if (snippets.length === 0) {
                list.innerHTML = '<div class="empty-state">No saved snippets.<br>Tap the bookmark icon on any code block to save it here.</div>';
                return;
            }
            snippets.forEach(snip => {
                const date = new Date(snip.savedAt);
                const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                const preview = snip.code.split('\n').find(l => l.trim()) || snip.code.split('\n')[0] || '';
                const div = document.createElement('div');
                div.className = 'snippet-item';
                div.innerHTML = `
                    <div class="snippet-meta">
                        <span class="snippet-lang">${escapeHtml(snip.lang)}</span>
                        <span class="snippet-date">${dateStr}</span>
                    </div>
                    <div class="snippet-preview">${escapeHtml(preview.substring(0, 60))}</div>
                    <div class="snippet-actions">
                        <button class="snippet-action-btn" onclick="openSnippet('${snip.id}', event)">Open</button>
                        <button class="snippet-action-btn" onclick="copySnippet('${snip.id}', event)">Copy</button>
                        <button class="snippet-action-btn" onclick="downloadSnippet('${snip.id}', event)">Download</button>
                        <button class="snippet-action-btn danger" onclick="deleteSnippet('${snip.id}', event)">Delete</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        /* ============================================================
           Welcome / Chat lifecycle
           ============================================================ */
        function renderWelcomeScreen() {
            document.getElementById('chat-container').innerHTML = `
                <div class="welcome-screen">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="url(#sparkle-grad-welcome)" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="sparkle-grad-welcome" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#4285f4"/>
                                <stop offset="50%" stop-color="#d96570"/>
                                <stop offset="100%" stop-color="#f4b400"/>
                            </linearGradient>
                        </defs>
                        <path d="M12.0001 22.5001C11.854 22.5001 11.7161 22.4276 11.6366 22.3023C9.9392 19.5898 7.64998 17.3006 4.93751 15.6032C4.81223 15.5237 4.73975 15.3858 4.73975 15.2397V15.2397C4.73975 15.0936 4.81223 14.9557 4.93751 14.8762C7.64998 13.1788 9.9392 10.8896 11.6366 8.17714C11.7161 8.05185 11.854 7.97937 12.0001 7.97937V7.97937C12.1462 7.97937 12.284 8.05185 12.3636 8.17714C14.061 10.8896 16.3502 13.1788 19.0627 14.8762C19.188 14.9557 19.2604 15.0936 19.2604 15.2397V15.2397C19.2604 15.3858 19.188 15.5237 19.0627 15.6032C16.3502 17.3006 14.061 19.5898 12.3636 22.3023C12.284 22.4276 12.1462 22.5001 12.0001 22.5001V22.5001Z"/>
                    </svg>
                    <h1 class="welcome-title">Hi Developer,<br>what's on your mind?</h1>
                    <p class="welcome-subtitle">Stream responses with smart code blocks. Save snippets, download files, preview HTML — all without leaving the chat.</p>
                </div>
            `;
        }

        function startNewChat() {
            currentChatId = null;
            chatContext = [{ role: 'system', content: SYSTEM_PROMPT }];
            renderWelcomeScreen();
            if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
            renderSidebar();
        }

        function loadChat(id) {
            const chatToLoad = conversations.find(c => c.id === id);
            if (!chatToLoad) return;
            currentChatId = id;
            chatContext = [...chatToLoad.messages];
            document.getElementById('chat-container').innerHTML = '';
            let hasMessages = false;
            chatContext.forEach((msg, idx) => {
                if (msg.role !== 'system') {
                    hasMessages = true;
                    addMessageVisual(msg.content, msg.role === 'user' ? 'user-message' : 'bot-message', idx);
                }
            });
            if (!hasMessages) renderWelcomeScreen();
            if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
            renderSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if (!confirm("Delete this conversation forever?")) return;
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem(STORAGE_CONVERSATIONS_KEY, JSON.stringify(conversations));
            if (currentChatId === id) startNewChat(); else renderSidebar();
        }

        function saveHistory() {
            const safeContext = chatContext.map(msg => ({ role: msg.role, content: msg.content, ...(msg.images ? { images: msg.images } : {}) }));
            if (!currentChatId) {
                currentChatId = Date.now().toString();
                const firstUserMsg = safeContext.find(m => m.role === 'user');
                let title = firstUserMsg ? firstUserMsg.content.substring(0, 40) + (firstUserMsg.content.length > 40 ? '...' : '') : 'New Chat';
                conversations.unshift({ id: currentChatId, title: title, messages: safeContext });
            } else {
                const index = conversations.findIndex(c => c.id === currentChatId);
                if (index !== -1) conversations[index].messages = safeContext;
            }
            localStorage.setItem(STORAGE_CONVERSATIONS_KEY, JSON.stringify(conversations));
            renderSidebar();
        }

        /* ============================================================
           Markdown rendering with enhanced code blocks
           ============================================================ */
        const renderer = new marked.Renderer();
        renderer.code = function({ text, lang }) {
            const validLanguage = (lang && hljs.getLanguage(lang)) ? lang : 'plaintext';
            const highlightedCode = hljs.highlight(text, { language: validLanguage }).value;
            return buildCodeBlockHtml(text, validLanguage, highlightedCode);
        };
        marked.setOptions({ renderer: renderer, breaks: false });

        function buildCodeBlockHtml(rawText, lang, highlightedHtml) {
            const lineCount = rawText.split('\n').length - (rawText.endsWith('\n') ? 1 : 0) || 1;
            const lineNumbersHtml = Array.from({ length: lineCount }, (_, i) => `<span>${i + 1}</span>`).join('');
            const encodedRaw = encodeURIComponent(rawText);
            const charCount = rawText.length;
            const meta = `${lineCount} ${lineCount === 1 ? 'line' : 'lines'} · ${charCount} chars`;
            const isHtml = (lang === 'html' || lang === 'xml');

            return `
                <div class="code-wrapper" data-lang="${lang}" data-raw="${encodedRaw}">
                    <div class="code-header">
                        <div class="code-header-left">
                            <span class="lang-label">${lang}</span>
                            <span class="code-meta">${meta}</span>
                        </div>
                        <div class="btn-group">
                            ${isHtml ? `<button class="code-btn preview-btn" onclick="openCanvasFromBlock(this)" title="Preview HTML"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><span class="btn-label">Preview</span></button>` : ''}
                            <button class="code-btn" onclick="toggleWrap(this)" title="Toggle line wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg><span class="btn-label">Wrap</span></button>
                            <button class="code-btn" onclick="expandCode(this)" title="Expand to fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg><span class="btn-label">Expand</span></button>
                            <button class="code-btn" onclick="downloadCodeBlock(this)" title="Download as file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span class="btn-label">Download</span></button>
                            <button class="code-btn" onclick="saveSnippetFromBlock(this)" title="Save to snippet vault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg><span class="btn-label">Save</span></button>
                            <button class="code-btn copy-btn" onclick="copyCodeBlock(this)" title="Copy code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span class="btn-label">Copy</span></button>

        /**
         * During streaming, an unclosed ``` fence would otherwise render as plain
         * text until the closing fence arrives. We auto-close it for rendering only
         * so the code block displays immediately and adds the streaming indicator.
         */
        function safeMarkdownParse(text, isStreaming) {
            const fenceMatches = text.match(/```/g);
            const fenceCount = fenceMatches ? fenceMatches.length : 0;
            if (isStreaming && fenceCount % 2 === 1) {
                return { html: marked.parse(text + '\n```'), hasOpenFence: true };
            }
            return { html: marked.parse(text), hasOpenFence: false };
        }

        /* ============================================================
           Code block button actions
           ============================================================ */
        function getRawCodeFromBlock(btn) {

            snippets.unshift(snip);
            persistSnippets();

            const originalText = label ? label.textContent : '';

           Snippet vault

        function loadSnippets() {

        /* ============================================================
           Clipboard & download utilities
           ============================================================ */
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise((resolve, reject) => {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.focus(); ta.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    ok ? resolve() : reject();
                } catch (e) { reject(e); }
            });
        }

        function downloadAsFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast(`Downloaded ${filename}`);
        }

        /* ============================================================
           Edit user message + Regenerate
           ============================================================ */
        function openEditModal(messageIndex) {
            const msg = chatContext[messageIndex];
            if (!msg || msg.role !== 'user') return;
            editingMessageIndex = messageIndex;
            // For editing we strip out any "[Attached: ...]" tail and the FILE CONTENTS block
            let editable = msg.content || '';
            editable = editable.split('\n\n--- FILE CONTENTS')[0];
            document.getElementById('edit-textarea').value = editable;
            document.getElementById('edit-modal').classList.add('open');
            setTimeout(() => document.getElementById('edit-textarea').focus(), 100);
        }

        function closeEditModal() {
            editingMessageIndex = null;
            document.getElementById('edit-modal').classList.remove('open');
        }

        function submitEditModal() {
            if (editingMessageIndex === null) return;
            const newText = document.getElementById('edit-textarea').value.trim();
            if (!newText) { showToast('Message cannot be empty'); return; }
            // Truncate context to before this message
            chatContext = chatContext.slice(0, editingMessageIndex);
            // Re-render visible messages from scratch up to truncation
            document.getElementById('chat-container').innerHTML = '';
            chatContext.forEach((m, i) => {
                if (m.role !== 'system') addMessageVisual(m.content, m.role === 'user' ? 'user-message' : 'bot-message', i);
            });
            document.getElementById('user-input').value = newText;
            closeEditModal();
            saveHistory();
            sendMessage();
        }

        function regenerateLastReply() {
            // Find the last assistant message and remove it (plus anything after).
            let lastAssistantIdx = -1;
            for (let i = chatContext.length - 1; i >= 0; i--) {
                if (chatContext[i].role === 'assistant') { lastAssistantIdx = i; break; }
            }
            if (lastAssistantIdx === -1) { showToast('No reply to regenerate'); return; }
            chatContext = chatContext.slice(0, lastAssistantIdx);
            document.getElementById('chat-container').innerHTML = '';
            chatContext.forEach((m, i) => {
                if (m.role !== 'system') addMessageVisual(m.content, m.role === 'user' ? 'user-message' : 'bot-message', i);
            });
            saveHistory();
            // Trigger another generation with the existing last user message
            streamCompletionForCurrentContext();
        }

        function copyEntireBotMessage(idx) {
            const msg = chatContext[idx];
            if (!msg) return;
            copyToClipboard(msg.content).then(() => showToast('Reply copied')).catch(() => showToast('Copy failed'));
        }

        /* ============================================================
           Message rendering

                const actions = document.createElement('div');

                actions.innerHTML = `
                    <button class="msg-action-btn" onclick="copyEntireBotMessage(${messageIndex})" title="Copy reply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Copy</button>
                    <button class="msg-action-btn" onclick="regenerateLastReply()" title="Regenerate this reply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>Regenerate</button>
                `;
                content.appendChild(actions);
                rowDiv.appendChild(content);
            } else {

                msgDiv.className = 'user-message';
                msgDiv.textContent = text;
                rowDiv.appendChild(msgDiv);
                const actions = document.createElement('div');

                actions.innerHTML = `
                    <button class="msg-action-btn" onclick="openEditModal(${messageIndex})" title="Edit and resend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>Edit</button>
                `;

            document.getElementById('chat-container').appendChild(rowDiv);

        function addTypingIndicator(id) {
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row bot-row`;
            rowDiv.id = id;
            rowDiv.innerHTML = `
                ${BOT_AVATAR_SVG}
                <div class="bot-content"><div class="typing" style="padding-left: 12px;"><span></span><span></span><span></span></div></div>
            `;
            document.getElementById('chat-container').appendChild(rowDiv);
            requestAutoScroll();
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        /* ============================================================
           Smart auto-scroll: only follow if user is near bottom
           ============================================================ */
        let userScrolledUp = false;
        const chatContainerRef = () => document.getElementById('chat-container');

        document.addEventListener('DOMContentLoaded', () => {
            const c = chatContainerRef();
            if (!c) return;
            c.addEventListener('scroll', () => {
                const nearBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 140;
                userScrolledUp = !nearBottom;
            }, { passive: true });
        });

        function requestAutoScroll(force) {
            const c = chatContainerRef();
            if (!c) return;
            if (force) userScrolledUp = false;
            if (userScrolledUp) return;
            requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
        }

        /* ============================================================
           Streaming engine with rAF-throttled render
           ============================================================ */
        let pendingRenderText = null;
        let pendingRenderStreaming = false;
        let lastRenderTime = 0;
        const MIN_RENDER_INTERVAL = 80; // ms; ~12 renders/sec is plenty for text streams

        function scheduleStreamRender(text, isStreaming) {
            pendingRenderText = text;
            pendingRenderStreaming = isStreaming;
            const now = performance.now();
            const since = now - lastRenderTime;
            if (since >= MIN_RENDER_INTERVAL) {
                doStreamRender();
            } else {
                setTimeout(() => { if (pendingRenderText !== null) doStreamRender(); }, MIN_RENDER_INTERVAL - since);
            }
        }

        function doStreamRender() {
            if (!currentBotMessageDiv || pendingRenderText === null) return;
            lastRenderTime = performance.now();
            const text = pendingRenderText;
            const isStreaming = pendingRenderStreaming;
            pendingRenderText = null;

            const { html, hasOpenFence } = safeMarkdownParse(text, isStreaming);
            currentBotMessageDiv.innerHTML = html;

            // Mark the in-flight code block with a "Streaming" badge for visibility
            if (isStreaming && hasOpenFence) {
                const wrappers = currentBotMessageDiv.querySelectorAll('.code-wrapper');
                const lastWrapper = wrappers[wrappers.length - 1];
                if (lastWrapper) {
                    const headerLeft = lastWrapper.querySelector('.code-header-left');
                    if (headerLeft && !headerLeft.querySelector('.code-streaming-badge')) {
                        const badge = document.createElement('span');
                        badge.className = 'code-streaming-badge';
                        badge.innerHTML = '<span class="dot"></span>Streaming';
                        headerLeft.appendChild(badge);
                    }
                }
            }

            // Append blinking caret at the very end of the message
            if (isStreaming) {
                const caret = document.createElement('span');
                caret.className = 'stream-caret';
                // Place caret inside the last block element if possible, else append to root
                const lastBlock = currentBotMessageDiv.lastElementChild;
                if (lastBlock && (lastBlock.tagName === 'P' || lastBlock.tagName === 'LI' || lastBlock.tagName === 'H1' || lastBlock.tagName === 'H2' || lastBlock.tagName === 'H3')) {
                    lastBlock.appendChild(caret);
                } else {
                    currentBotMessageDiv.appendChild(caret);
                }
            }

            requestAutoScroll();
        }

        async function sendMessage() {
            if (isWaitingForReply) return;
            let text = document.getElementById('user-input').value.trim();
            if (!text && attachedFiles.length === 0) return;
            if (!currentModel) {
                showToast('No active model available.');
                return;
            }

            removeWelcomeScreen();
            setStreamingUiState(true);

            let displayMessage = text;
            if (attachedFiles.length > 0) {
                const namesList = attachedFiles.map(f => f.name).join(', ');
                displayMessage += displayMessage ? `\n\n[Attached: ${namesList}]` : `[Attached: ${namesList}]`;
            }

            // Place user message in DOM with index = current chatContext length
            const userMessageIndex = chatContext.length;
            addMessageVisual(displayMessage, 'user-message', userMessageIndex);

            let finalPrompt = text;
            const textFiles = attachedFiles.filter(f => f.type === 'text');
            if (textFiles.length > 0) {
                textFiles.forEach(f => {
                    finalPrompt += `\n\n--- FILE CONTENTS (${f.name}) ---\n${f.content}`;
                });
            }

            let userMsgObj = { role: 'user', content: finalPrompt || 'Please review these files.' };
            const imageFiles = attachedFiles.filter(f => f.type === 'image');
            if (imageFiles.length > 0) {
                userMsgObj.images = imageFiles.map(f => f.content);
            }

            chatContext.push(userMsgObj);
            saveHistory();

            document.getElementById('user-input').value = '';
            autoResizeInput();
            clearAttachment();

            await streamCompletionForCurrentContext();
        }

        async function streamCompletionForCurrentContext() {
            setStreamingUiState(true);
            const typingRowId = `typing-${Date.now()}`;
            addTypingIndicator(typingRowId);

            // Build the streaming bot container
            const botContent = document.createElement('div');
            botContent.className = 'bot-content';
            const botMessageDiv = document.createElement('div');
            botMessageDiv.className = 'bot-message';
            botContent.appendChild(botMessageDiv);

            const botRow = document.createElement('div');
            botRow.className = 'message-row bot-row';
            botRow.innerHTML = BOT_AVATAR_SVG;
            botRow.appendChild(botContent);
            document.getElementById('chat-container').appendChild(botRow);

            currentBotContent = botContent;
            currentBotMessageDiv = botMessageDiv;
            requestAutoScroll(true);

            const requestBody = {
                model: currentModel,
                messages: chatContext.filter(m => m.role !== undefined),
                stream: true
            };

            currentStreamController = new AbortController();
            const timeoutId = setTimeout(() => currentStreamController.abort('timeout'), 300000);
            let fullResponseText = "";
            let aborted = false;

            try {
                const response = await fetch(VPS_OLLAMA_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody),
                    signal: currentStreamController.signal
                });

                clearTimeout(timeoutId);
                removeTypingIndicator(typingRowId);

                if (!response.ok) {
                    const errorJson = await response.json().catch(() => ({}));
                    throw new Error(errorJson.error || `HTTP Error ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        if (buffer.trim()) {
                            try {
                                const json = JSON.parse(buffer);
                                if (json.message && json.message.content) {
                                    fullResponseText += json.message.content;
                                }
                            } catch (e) { /* ignore final partial */ }
                        }
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const json = JSON.parse(line);
                            if (json.message && json.message.content) {
                                fullResponseText += json.message.content;
                                scheduleStreamRender(fullResponseText, true);
                            }
                        } catch (e) {
                            console.warn("Skipped incomplete stream chunk");
                        }
                    }
                }

                // Final render (no streaming flag → no caret, no auto-close fences)
                pendingRenderText = fullResponseText;
                pendingRenderStreaming = false;
                doStreamRender();

                // Push to history and replace the streaming container with a proper message visual
                // so that the action bar (Copy / Regenerate) is attached with the correct index.
                chatContext.push({ role: 'assistant', content: fullResponseText });
                // Remove the streaming row and re-render via addMessageVisual with proper actions
                botRow.remove();
                addMessageVisual(fullResponseText, 'bot-message', chatContext.length - 1);
                saveHistory();

            } catch (error) {
                clearTimeout(timeoutId);
                console.error('API Error:', error);
                if (error.name === 'AbortError' || currentStreamController.signal.aborted) {
                    aborted = true;
                    // Preserve partial response if any
                    if (fullResponseText.trim()) {
                        pendingRenderText = fullResponseText + '\n\n*— stopped by user —*';
                        pendingRenderStreaming = false;
                        doStreamRender();
                        chatContext.push({ role: 'assistant', content: fullResponseText + '\n\n*— stopped by user —*' });
                        botRow.remove();
                        addMessageVisual(fullResponseText + '\n\n*— stopped by user —*', 'bot-message', chatContext.length - 1);
                        saveHistory();
                    } else {
                        botRow.remove();
                        addMessageVisual('⚠️ Stopped before any reply was received.', 'bot-message', chatContext.length);
                    }
                } else {
                    botRow.remove();
                    addMessageVisual(`⚠️ **API Error:** ${error.message}`, 'bot-message', chatContext.length);
                }
            } finally {
                currentStreamController = null;
                currentBotContent = null;
                currentBotMessageDiv = null;
                setStreamingUiState(false);
                document.getElementById('user-input').focus();
                updateSendButtonState();
            }
        }

        function stopGeneration() {
            if (currentStreamController) {
                try { currentStreamController.abort(); } catch (e) {}
            }
        }

        function setStreamingUiState(streaming) {
            isWaitingForReply = streaming;
            const sendBtn = document.getElementById('send-btn');
            const stopBtn = document.getElementById('stop-btn');
            if (streaming) {
                sendBtn.style.display = 'none';
                stopBtn.classList.add('visible');
            } else {
                sendBtn.style.display = 'flex';
                stopBtn.classList.remove('visible');
            }
        }

        /* ============================================================
           Input/file handling
           ============================================================ */
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-upload');
        const attachmentPreview = document.getElementById('attachment-preview');
        const attachmentName = document.getElementById('attachment-name');
        const chatContainer = document.getElementById('chat-container');

        let attachedFiles = [];

        document.body.addEventListener('touchmove', function(e) {
            const canvasOpen = document.getElementById('canvas-modal').classList.contains('open');
            const codeOpen = document.getElementById('code-modal').classList.contains('open');
            const editOpen = document.getElementById('edit-modal').classList.contains('open');
            const sidebarOpen = document.getElementById('sidebar-overlay').style.display === 'block';
            if (!canvasOpen && !codeOpen && !editOpen && !sidebarOpen
                && !chatContainer.contains(e.target)
                && !document.getElementById('sidebar').contains(e.target)) {
                e.preventDefault();
            }
        }, { passive: false });

        fileInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            attachmentPreview.style.display = 'flex';
            attachmentName.textContent = 'Loading files...';
            const filePromises = files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onerror = () => { resolve({ name: file.name, type: 'text', content: '[Error reading file]' }); };
                    if (file.type.startsWith('image/')) {
                        reader.onload = function(event) { resolve({ name: file.name, type: 'image', content: event.target.result.split(',')[1] }); };
                        reader.readAsDataURL(file);
                    } else {
                        reader.onload = function(event) { resolve({ name: file.name, type: 'text', content: event.target.result }); };
                        reader.readAsText(file);
                    }
                });
            });
            attachedFiles = await Promise.all(filePromises);
            attachmentName.textContent = attachedFiles.map(f => f.name).join(', ');
            updateSendButtonState();
        });

        function clearAttachment() {
            fileInput.value = '';
            attachedFiles = [];
            attachmentPreview.style.display = 'none';
            updateSendButtonState();
        }

        function autoResizeInput() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
            updateSendButtonState();
        }

        function updateSendButtonState() {
            if (userInput.value.trim() !== '' || attachedFiles.length > 0) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        }

        userInput.addEventListener('input', autoResizeInput);
        userInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function removeWelcomeScreen() {
            const welcomeScreen = document.querySelector('.welcome-screen');
            if (welcomeScreen) welcomeScreen.remove();
        }

        // ESC closes modals
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('canvas-modal').classList.contains('open')) closeCanvas();
                else if (document.getElementById('code-modal').classList.contains('open')) closeCodeModal();
                else if (document.getElementById('edit-modal').classList.contains('open')) closeEditModal();
            }
        });
    </script>
</body>
</html>
