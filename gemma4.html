<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Qwen Pro Coder</title>
    
    <!-- Load Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Load Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: #f4f4f7; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: 100dvh; 
            overscroll-behavior-y: none; 
        }
        
        /* -----------------------------------------
           Header & Navigation
        ------------------------------------------*/
        header { background-color: #ffffff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5ea; color: #1c1c1e; flex-shrink: 0; z-index: 10; padding-top: calc(env(safe-area-inset-top, 16px) + 8px); }
        .header-title { font-weight: 600; font-size: 1.1rem; text-align: center; flex-grow: 1; }
        .header-btn { background: transparent; color: #1c1c1e; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        
        /* -----------------------------------------
           Sidebar (Hamburger Menu)
        ------------------------------------------*/
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: none; opacity: 0; transition: opacity 0.3s ease; }
        #sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100dvh; background: #ffffff; z-index: 200; transition: left 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #e5e5ea; display: flex; justify-content: space-between; align-items: center; padding-top: calc(env(safe-area-inset-top, 16px) + 12px); font-weight: 600; }
        #chat-list { flex-grow: 1; overflow-y: auto; padding: 8px 0; }
        
        .chat-item { padding: 12px 16px; border-bottom: 1px solid #f4f4f7; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .chat-item:hover { background-color: #f4f4f7; }
        .chat-item.active { background-color: #e5f1ff; border-left: 4px solid #007aff; }
        .chat-title { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; padding-right: 8px; color: #1c1c1e; }
        .chat-delete { background: none; border: none; color: #ff3b30; font-size: 1.2rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }

        /* -----------------------------------------
           Chat UI & Message Bubbles
        ------------------------------------------*/
        #chat-container { flex-grow: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message { max-width: 90%; padding: 12px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-message { align-self: flex-end; background-color: #007aff; color: white; border-bottom-right-radius: 4px; }
        .bot-message { align-self: flex-start; background-color: #ffffff; border: 1px solid #e5e5ea; color: black; border-bottom-left-radius: 4px; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .bot-message p { margin-bottom: 8px; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin-left: 20px; margin-bottom: 8px; }
        .bot-message code:not(.hljs) { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background-color: #f0f0f5; padding: 2px 5px; border-radius: 4px; font-size: 0.85rem; color: #d73a49; }
        
        /* Code Blocks */
        .code-wrapper { margin: 12px 0; border-radius: 8px; overflow: hidden; background-color: #0d1117; border: 1px solid #30363d; }
        .code-header { display: flex; justify-content: space-between; align-items: center; background-color: #161b22; padding: 6px 12px; border-bottom: 1px solid #30363d; }
        .lang-label { color: #8b949e; font-size: 0.75rem; font-family: ui-monospace, monospace; text-transform: uppercase; font-weight: bold; }
        .btn-group { display: flex; gap: 8px; }
        .copy-btn { background-color: transparent; border: 1px solid #8b949e; color: #8b949e; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; font-family: -apple-system, sans-serif; }
        .copy-btn:hover { background-color: #30363d; color: #c9d1d9; }
        .copy-btn.copied { background-color: #238636; color: white; border-color: #238636; }
        .preview-btn { background-color: #007aff; color: white; border: 1px solid #007aff; }
        .bot-message pre { margin: 0; padding: 12px; overflow: auto; max-height: 250px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.85rem; }
        .bot-message pre code { background-color: transparent; padding: 0; color: #c9d1d9; }
        
        /* -----------------------------------------
           Live Canvas Modal 
        ------------------------------------------*/
        #canvas-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #ffffff; z-index: 300; flex-direction: column; }
        #canvas-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f4f4f7; border-bottom: 1px solid #c7c7cc; padding-top: calc(env(safe-area-inset-top, 16px) + 12px); }
        #canvas-title { font-weight: 600; font-size: 1.1rem; color: #1c1c1e; }
        .close-canvas-btn { background: #e5e5ea; color: #1c1c1e; border: none; padding: 6px 12px; border-radius: 16px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        #canvas-iframe { flex-grow: 1; border: none; width: 100%; background: #ffffff; }

        /* Other Utilities */
        .typing { font-style: italic; color: #8e8e93; font-size: 0.85rem; align-self: flex-start; display: none; margin-top: -8px; padding-left: 16px; }
        #attachment-preview { background-color: #e5e5ea; padding: 8px 16px; font-size: 0.85rem; color: #1c1c1e; display: none; align-items: center; justify-content: space-between; border-top: 1px solid #c7c7cc; }
        #attachment-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 8px; }
        .remove-attachment { color: #ff3b30; cursor: pointer; font-weight: bold; padding: 4px; flex-shrink: 0; }

        /* Input Area */
        #input-area { background-color: #ffffff; padding: 12px 16px; border-top: 1px solid #e5e5ea; display: flex; gap: 8px; flex-shrink: 0; padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 12px); align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 12px 16px; border: 1px solid #c7c7cc; border-radius: 24px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #007aff; }
        .icon-btn { background-color: transparent; color: #8e8e93; border: none; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .send-btn { background-color: #007aff; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;}
        .send-btn:disabled { background-color: #a1c8ff; cursor: not-allowed; }
        #file-upload { display: none; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <!-- Hamburger Icon -->
        <button class="header-btn" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        
        <div class="header-title">Qwen Pro Coder</div>
        
        <!-- New Chat Icon (Square with pencil) -->
        <button class="header-btn" onclick="startNewChat()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </button>
    </header>

    <!-- Sidebar Overlay & Menu -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <span>Conversations</span>
            <button class="header-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div id="chat-list">
            <!-- Chat history links get injected here -->
        </div>
    </div>

    <div id="chat-container">
        <!-- Messages will be injected here dynamically -->
    </div>
    <div class="typing" id="typing-indicator">Analyzing...</div>

    <!-- Multi-File Attachment Preview Bar -->
    <div id="attachment-preview">
        <span id="attachment-name">filename.txt</span>
        <span class="remove-attachment" onclick="clearAttachment()">✕</span>
    </div>

    <div id="input-area">
        <button class="icon-btn" onclick="document.getElementById('file-upload').click()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <!-- ADDED "multiple" ATTRIBUTE HERE -->
        <input type="file" id="file-upload" accept="image/*,.txt,.csv,.md,.json,.js,.py,.html,.css,.jsx,.ts,.cpp,.java" multiple>
        
        <input type="text" id="user-input" placeholder="Ask a coding question..." autocomplete="off">
        
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <!-- Live Canvas Screen -->
    <div id="canvas-modal">
        <div id="canvas-header">
            <span id="canvas-title">Live Preview</span>
            <button class="close-canvas-btn" onclick="closeCanvas()">Close</button>
        </div>
        <iframe id="canvas-iframe"></iframe>
    </div>

    <script>
        // --- CONFIGURATION ---
        const VPS_OLLAMA_URL = 'https://ollama.th3va.com/api/chat'; 
        const CLOUD_MODEL_NAME = 'qwen3-coder:480b-cloud';
        const SYSTEM_PROMPT = "You are an expert Senior Software Engineer. Provide concise, efficient code. When generating web code (HTML/CSS/JS), ALWAYS output it as a single, fully-contained HTML document block so it can be previewed. Explain complex logic briefly.";

        // --- SESSION MANAGEMENT LOGIC ---
        let conversations = []; 
        let currentChatId = null; 
        let chatContext = []; 

        window.onload = function() {
            const savedConversations = localStorage.getItem('qwen_conversations');
            if (savedConversations) {
                conversations = JSON.parse(savedConversations);
            } else {
                const oldMemory = localStorage.getItem('qwen_chat_memory');
                if (oldMemory) {
                    const parsedOld = JSON.parse(oldMemory);
                    if (parsedOld.length > 1) {
                        conversations = [{ id: Date.now().toString(), title: 'Legacy Chat', messages: parsedOld }];
                        localStorage.setItem('qwen_conversations', JSON.stringify(conversations));
                    }
                    localStorage.removeItem('qwen_chat_memory'); 
                }
            }

            if (conversations.length > 0) {
                loadChat(conversations[0].id);
            } else {
                startNewChat();
            }
        };

        // --- SIDEBAR UI LOGIC ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);
            } else {
                sidebar.classList.add('open');
                overlay.style.display = 'block';
                setTimeout(() => overlay.style.opacity = '1', 10);
            }
        }

        function renderSidebar() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            conversations.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.onclick = () => loadChat(chat.id);
                div.innerHTML = `
                    <div class="chat-title">${chat.title}</div>
                    <button class="chat-delete" onclick="deleteChat('${chat.id}', event)">✕</button>
                `;
                list.appendChild(div);
            });
        }

        function startNewChat() {
            currentChatId = null;
            chatContext = [{ role: 'system', content: SYSTEM_PROMPT }];
            document.getElementById('chat-container').innerHTML = '';
            addMessageVisual("Cloud Pro Engine Online. Connected to Qwen 480B. Ready to assist with software engineering.", 'bot-message');
            if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
            renderSidebar();
        }

        function loadChat(id) {
            const chatToLoad = conversations.find(c => c.id === id);
            if (!chatToLoad) return;
            currentChatId = id;
            chatContext = [...chatToLoad.messages];
            document.getElementById('chat-container').innerHTML = '';
            chatContext.forEach(msg => {
                if (msg.role !== 'system') addMessageVisual(msg.content, msg.role === 'user' ? 'user-message' : 'bot-message');
            });
            if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
            renderSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation(); 
            if (!confirm("Delete this conversation forever?")) return;
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem('qwen_conversations', JSON.stringify(conversations));
            if (currentChatId === id) startNewChat(); else renderSidebar();
        }

        function saveHistory() {
            const safeContext = chatContext.map(msg => ({ role: msg.role, content: msg.content }));
            if (!currentChatId) {
                currentChatId = Date.now().toString();
                const firstUserMsg = safeContext.find(m => m.role === 'user');
                let title = firstUserMsg ? firstUserMsg.content.substring(0, 30) + '...' : 'New Chat';
                conversations.unshift({ id: currentChatId, title: title, messages: safeContext });
            } else {
                const index = conversations.findIndex(c => c.id === currentChatId);
                if (index !== -1) conversations[index].messages = safeContext;
            }
            localStorage.setItem('qwen_conversations', JSON.stringify(conversations));
            renderSidebar(); 
        }

        // --- MARKED.JS & HIGHLIGHT.JS SETUP ---
        const renderer = new marked.Renderer();
        renderer.code = function({text, lang}) {
            const validLanguage = hljs.getLanguage(lang) ? lang : 'plaintext';
            const highlightedCode = hljs.highlight(text, { language: validLanguage }).value;
            let previewBtnHTML = '';
            if (lang === 'html' || lang === 'xml') {
                previewBtnHTML = `<button class="copy-btn preview-btn" onclick="openCanvas(this)">Preview</button>`;
            }
            return `
                <div class="code-wrapper">
                    <div class="code-header">
                        <span class="lang-label">${validLanguage}</span>
                        <div class="btn-group">${previewBtnHTML}<button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
                    </div>
                    <pre><code class="hljs ${validLanguage}">${highlightedCode}</code></pre>
                </div>`;
        };
        marked.setOptions({ renderer: renderer });

        // --- CANVAS & COPY LOGIC ---
        window.openCanvas = function(button) {
            const pre = button.parentElement.parentElement.nextElementSibling;
            const doc = document.getElementById('canvas-iframe').contentWindow.document;
            document.getElementById('canvas-modal').style.display = 'flex';
            doc.open(); doc.write(pre.textContent); doc.close();
        };

        window.closeCanvas = function() {
            document.getElementById('canvas-modal').style.display = 'none';
            document.getElementById('canvas-iframe').src = 'about:blank'; 
        };

        window.copyCode = function(button) {
            const codeText = button.parentElement.parentElement.nextElementSibling.textContent;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(codeText).catch(() => fallbackCopy(codeText, button));
            } else { fallbackCopy(codeText, button); }
            button.textContent = 'Copied!'; button.classList.add('copied');
            setTimeout(() => { button.textContent = 'Copy'; button.classList.remove('copied'); }, 2000);
        };

        function fallbackCopy(text, button) {
            let textArea = document.createElement("textarea"); textArea.value = text;
            textArea.style.top = "0"; textArea.style.left = "0"; textArea.style.position = "fixed";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand("copy"); } catch (err) {} textArea.remove();
        }

        // --- DOM ELEMENTS & MULTI-FILE UPLOAD LOGIC ---
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const fileInput = document.getElementById('file-upload');
        const attachmentPreview = document.getElementById('attachment-preview');
        const attachmentName = document.getElementById('attachment-name');

        // NEW: Array to hold multiple files
        let attachedFiles = []; 

        document.body.addEventListener('touchmove', function(e) {
            const canvasModal = document.getElementById('canvas-modal');
            const sidebarModal = document.getElementById('sidebar-overlay');
            if (canvasModal.style.display !== 'flex' && sidebarModal.style.display !== 'block' && !chatContainer.contains(e.target) && !document.getElementById('sidebar').contains(e.target)) {
                e.preventDefault();
            }
        }, { passive: false });

        // REWRITTEN: Handles arrays of files simultaneously 
        fileInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            attachmentPreview.style.display = 'flex';
            attachmentName.textContent = 'Loading files...';

            const filePromises = files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    if (file.type.startsWith('image/')) {
                        reader.onload = function(event) {
                            resolve({ name: file.name, type: 'image', content: event.target.result.split(',')[1] });
                        };
                        reader.readAsDataURL(file);
                    } else {
                        reader.onload = function(event) {
                            resolve({ name: file.name, type: 'text', content: event.target.result });
                        };
                        reader.readAsText(file);
                    }
                });
            });

            // Wait for all files to be read and loaded into memory
            attachedFiles = await Promise.all(filePromises);
            
            // Update the UI with a comma-separated list of filenames
            attachmentName.textContent = attachedFiles.map(f => f.name).join(', ');
        });

        function clearAttachment() {
            fileInput.value = ''; 
            attachedFiles = []; 
            attachmentPreview.style.display = 'none';
        }

        // --- CHAT LOGIC ---
        userInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            let text = userInput.value.trim();
            if (!text && attachedFiles.length === 0) return;

            // 1. Render User Message (Showing all attached file names)
            let displayMessage = text;
            if (attachedFiles.length > 0) {
                const namesList = attachedFiles.map(f => f.name).join(', ');
                displayMessage += displayMessage ? `\n\n[Attached: ${namesList}]` : `[Attached: ${namesList}]`;
            }

            addMessageVisual(displayMessage, 'user-message');
            
            // 2. Format Prompt with Multi-File Contents
            let finalPrompt = text;
            const textFiles = attachedFiles.filter(f => f.type === 'text');
            if (textFiles.length > 0) {
                textFiles.forEach(f => {
                    finalPrompt += `\n\n--- FILE CONTENTS (${f.name}) ---\n${f.content}`;
                });
            }

            let userMsgObj = { role: 'user', content: finalPrompt || 'Please review these files.' };
            
            // 3. Attach multiple images (if any)
            const imageFiles = attachedFiles.filter(f => f.type === 'image');
            if (imageFiles.length > 0) {
                userMsgObj.images = imageFiles.map(f => f.content);
            }
            
            chatContext.push(userMsgObj);
            saveHistory(); 

            userInput.value = '';
            sendBtn.disabled = true;
            typingIndicator.style.display = 'block';
            
            const requestBody = {
                model: CLOUD_MODEL_NAME,
                messages: chatContext,
                stream: false
            };

            clearAttachment();

            try {
                const response = await fetch(VPS_OLLAMA_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                
                const data = await response.json();
                const aiReply = data.message.content; 
                
                chatContext.push({ role: 'assistant', content: aiReply });
                saveHistory();
                
                addMessageVisual(aiReply, 'bot-message');

            } catch (error) {
                console.error('API Error:', error);
                chatContext.pop(); 
                addMessageVisual(`⚠️ **API Error:** Could not connect. Please check your VPS.`, 'bot-message');
            } finally {
                sendBtn.disabled = false;
                typingIndicator.style.display = 'none';
                userInput.focus();
            }
        }

        // --- PURE VISUAL RENDERING ---
        function addMessageVisual(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            
            if (className === 'bot-message') {
                if (typeof marked !== 'undefined') {
                    msgDiv.innerHTML = marked.parse(text);
                } else { msgDiv.textContent = text; }
            } else {
                msgDiv.innerText = text;
            }
            
            chatContainer.appendChild(msgDiv);
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }
    </script>
</body>
</html>
