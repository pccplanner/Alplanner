<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Qwen Pro Coder</title>
    
    <!-- Load Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Load Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: #f4f4f7; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: 100dvh; 
            overscroll-behavior-y: none; 
        }
        
        /* Header with Clear Button */
        header { background-color: #ffffff; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5ea; color: #1c1c1e; flex-shrink: 0; z-index: 10; padding-top: env(safe-area-inset-top, 16px); }
        .header-spacer { width: 44px; }
        .header-title { font-weight: 600; font-size: 1.1rem; text-align: center; flex-grow: 1; }
        .clear-btn { background: transparent; color: #ff3b30; border: none; font-size: 0.95rem; font-weight: 500; cursor: pointer; width: 44px; text-align: right; }
        
        /* Chat Container */
        #chat-container { flex-grow: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message { max-width: 90%; padding: 12px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-message { align-self: flex-end; background-color: #007aff; color: white; border-bottom-right-radius: 4px; }
        
        /* Bot Message & Markdown Formatting Rules */
        .bot-message { align-self: flex-start; background-color: #ffffff; border: 1px solid #e5e5ea; color: black; border-bottom-left-radius: 4px; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .bot-message p { margin-bottom: 8px; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin-left: 20px; margin-bottom: 8px; }
        
        /* Inline Code */
        .bot-message code:not(.hljs) { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background-color: #f0f0f5; padding: 2px 5px; border-radius: 4px; font-size: 0.85rem; color: #d73a49; }
        
        /* Developer Code Block UI */
        .code-wrapper { margin: 12px 0; border-radius: 8px; overflow: hidden; background-color: #0d1117; border: 1px solid #30363d; }
        .code-header { display: flex; justify-content: space-between; align-items: center; background-color: #161b22; padding: 6px 12px; border-bottom: 1px solid #30363d; }
        .lang-label { color: #8b949e; font-size: 0.75rem; font-family: ui-monospace, monospace; text-transform: uppercase; font-weight: bold; }
        
        .btn-group { display: flex; gap: 8px; }
        .copy-btn { background-color: transparent; border: 1px solid #8b949e; color: #8b949e; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; font-family: -apple-system, sans-serif; }
        .copy-btn:hover { background-color: #30363d; color: #c9d1d9; }
        .copy-btn.copied { background-color: #238636; color: white; border-color: #238636; }
        .preview-btn { background-color: #007aff; color: white; border: 1px solid #007aff; }
        
        .bot-message pre { margin: 0; padding: 12px; overflow: auto; max-height: 250px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.85rem; }
        .bot-message pre code { background-color: transparent; padding: 0; color: #c9d1d9; }
        
        /* Live Canvas Modal */
        #canvas-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #ffffff; z-index: 100; flex-direction: column; }
        #canvas-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f4f4f7; border-bottom: 1px solid #c7c7cc; padding-top: calc(env(safe-area-inset-top, 16px) + 12px); }
        #canvas-title { font-weight: 600; font-size: 1.1rem; color: #1c1c1e; }
        .close-canvas-btn { background: #e5e5ea; color: #1c1c1e; border: none; padding: 6px 12px; border-radius: 16px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        #canvas-iframe { flex-grow: 1; border: none; width: 100%; background: #ffffff; }

        /* Loading Indicator */
        .typing { font-style: italic; color: #8e8e93; font-size: 0.85rem; align-self: flex-start; display: none; margin-top: -8px; padding-left: 16px; }

        /* Attachment Preview */
        #attachment-preview { background-color: #e5e5ea; padding: 8px 16px; font-size: 0.85rem; color: #1c1c1e; display: none; align-items: center; justify-content: space-between; border-top: 1px solid #c7c7cc; }
        .remove-attachment { color: #ff3b30; cursor: pointer; font-weight: bold; padding: 4px; }

        /* Input Area */
        #input-area { background-color: #ffffff; padding: 12px 16px; border-top: 1px solid #e5e5ea; display: flex; gap: 8px; flex-shrink: 0; padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 12px); align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 12px 16px; border: 1px solid #c7c7cc; border-radius: 24px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #007aff; }
        
        .icon-btn { background-color: transparent; color: #8e8e93; border: none; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .send-btn { background-color: #007aff; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;}
        .send-btn:disabled { background-color: #a1c8ff; cursor: not-allowed; }
        #file-upload { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-spacer"></div>
        <div class="header-title">Qwen Pro Coder</div>
        <button class="clear-btn" onclick="clearHistory()">Clear</button>
    </header>

    <div id="chat-container">
        <!-- Messages will be injected here dynamically by Javascript -->
    </div>
    <div class="typing" id="typing-indicator">Analyzing...</div>

    <div id="attachment-preview">
        <span id="attachment-name">filename.txt</span>
        <span class="remove-attachment" onclick="clearAttachment()">✕</span>
    </div>

    <div id="input-area">
        <button class="icon-btn" onclick="document.getElementById('file-upload').click()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="file-upload" accept="image/*,.txt,.csv,.md,.json,.js,.py,.html,.css,.jsx,.ts,.cpp,.java">
        
        <input type="text" id="user-input" placeholder="Ask a coding question..." autocomplete="off">
        
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <!-- Live Canvas Screen -->
    <div id="canvas-modal">
        <div id="canvas-header">
            <span id="canvas-title">Live Preview</span>
            <button class="close-canvas-btn" onclick="closeCanvas()">Close</button>
        </div>
        <iframe id="canvas-iframe"></iframe>
    </div>

    <script>
        // --- CONFIGURATION ---
        // CHANGED: We now use the /api/chat endpoint instead of /generate so the AI has memory!
        const VPS_OLLAMA_URL = 'https://ollama.th3va.com/api/chat'; 
        const CLOUD_MODEL_NAME = 'qwen3-coder:480b-cloud';
        
        const SYSTEM_PROMPT = "You are an expert Senior Software Engineer. Provide concise, efficient code. When generating web code (HTML/CSS/JS), ALWAYS output it as a single, fully-contained HTML document block so it can be previewed. Explain complex logic briefly.";

        // Array to hold the conversation memory
        let chatContext = [];

        // --- LOCAL STORAGE MEMORY (Load on Startup) ---
        window.onload = function() {
            const savedHistory = localStorage.getItem('qwen_chat_memory');
            
            if (savedHistory) {
                // If history exists, load it into memory and render it to the screen
                chatContext = JSON.parse(savedHistory);
                chatContext.forEach(msg => {
                    if (msg.role !== 'system') {
                        // Rebuild visual chat (without Markdown re-parsing on user messages)
                        addMessageVisual(msg.content, msg.role === 'user' ? 'user-message' : 'bot-message');
                    }
                });
            } else {
                // If no history exists, start fresh
                clearHistory(); 
            }
        };

        function saveHistory() {
            try {
                // We strip images before saving to prevent crashing Safari's 5MB localStorage limit
                const safeContext = chatContext.map(msg => ({ role: msg.role, content: msg.content }));
                localStorage.setItem('qwen_chat_memory', JSON.stringify(safeContext));
            } catch (e) {
                console.warn("Storage full, could not save memory.");
            }
        }

        window.clearHistory = function() {
            if (chatContext.length > 1 && !confirm("Are you sure you want to clear the chat history?")) return;
            
            localStorage.removeItem('qwen_chat_memory');
            chatContext = [{ role: 'system', content: SYSTEM_PROMPT }];
            
            // Clear screen and show welcome message
            document.getElementById('chat-container').innerHTML = '';
            addMessageVisual("Cloud Pro Engine Online. Connected to Qwen 480B. Ready to assist with software engineering.", 'bot-message');
        };

        // --- MARKED.JS & HIGHLIGHT.JS SETUP ---
        const renderer = new marked.Renderer();
        renderer.code = function({text, lang}) {
            const validLanguage = hljs.getLanguage(lang) ? lang : 'plaintext';
            const highlightedCode = hljs.highlight(text, { language: validLanguage }).value;
            
            let previewBtnHTML = '';
            if (lang === 'html' || lang === 'xml') {
                previewBtnHTML = `<button class="copy-btn preview-btn" onclick="openCanvas(this)">Preview</button>`;
            }

            return `
                <div class="code-wrapper">
                    <div class="code-header">
                        <span class="lang-label">${validLanguage}</span>
                        <div class="btn-group">
                            ${previewBtnHTML}
                            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                        </div>
                    </div>
                    <pre><code class="hljs ${validLanguage}">${highlightedCode}</code></pre>
                </div>`;
        };
        marked.setOptions({ renderer: renderer });

        // --- CANVAS LOGIC ---
        window.openCanvas = function(button) {
            const pre = button.parentElement.parentElement.nextElementSibling;
            const codeText = pre.textContent;
            const modal = document.getElementById('canvas-modal');
            const iframe = document.getElementById('canvas-iframe');
            modal.style.display = 'flex';
            const doc = iframe.contentWindow.document;
            doc.open(); doc.write(codeText); doc.close();
        };

        window.closeCanvas = function() {
            document.getElementById('canvas-modal').style.display = 'none';
            document.getElementById('canvas-iframe').src = 'about:blank'; 
        };

        // --- COPY LOGIC ---
        window.copyCode = function(button) {
            const pre = button.parentElement.parentElement.nextElementSibling;
            const codeText = pre.textContent;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(codeText).catch(() => fallbackCopy(codeText, button));
            } else { fallbackCopy(codeText, button); }
            button.textContent = 'Copied!'; button.classList.add('copied');
            setTimeout(() => { button.textContent = 'Copy'; button.classList.remove('copied'); }, 2000);
        };

        function fallbackCopy(text, button) {
            let textArea = document.createElement("textarea"); textArea.value = text;
            textArea.style.top = "0"; textArea.style.left = "0"; textArea.style.position = "fixed";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand("copy"); } catch (err) {} textArea.remove();
        }

        // --- DOM ELEMENTS & FILE UPLOAD ---
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const fileInput = document.getElementById('file-upload');
        const attachmentPreview = document.getElementById('attachment-preview');
        const attachmentName = document.getElementById('attachment-name');

        let attachedImageBase64 = null;
        let attachedTextContent = null;

        document.body.addEventListener('touchmove', function(e) {
            const canvasModal = document.getElementById('canvas-modal');
            if (canvasModal.style.display !== 'flex' && !chatContainer.contains(e.target)) e.preventDefault();
        }, { passive: false });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            attachmentName.textContent = file.name;
            attachmentPreview.style.display = 'flex';
            const reader = new FileReader();

            if (file.type.startsWith('image/')) {
                reader.onload = function(event) { attachedImageBase64 = event.target.result.split(',')[1]; attachedTextContent = null; };
                reader.readAsDataURL(file);
            } else {
                reader.onload = function(event) { attachedTextContent = event.target.result; attachedImageBase64 = null; };
                reader.readAsText(file);
            }
        });

        function clearAttachment() {
            fileInput.value = ''; attachedImageBase64 = null; attachedTextContent = null; attachmentPreview.style.display = 'none';
        }

        // --- CHAT LOGIC ---
        userInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            let text = userInput.value.trim();
            if (!text && !attachedImageBase64 && !attachedTextContent) return;

            let displayMessage = text;
            if (attachmentPreview.style.display === 'flex') {
                displayMessage += displayMessage ? `\n\n[Attached File: ${attachmentName.textContent}]` : `[Attached File: ${attachmentName.textContent}]`;
            }

            // 1. Render User Message on Screen
            addMessageVisual(displayMessage, 'user-message');
            
            let finalPrompt = text;
            if (attachedTextContent) {
                finalPrompt += `\n\n--- FILE CONTENTS (${attachmentName.textContent}) ---\n${attachedTextContent}`;
            }

            // 2. Add User Message to AI Memory
            let userMsgObj = { role: 'user', content: finalPrompt || 'Please review this file.' };
            if (attachedImageBase64) userMsgObj.images = [attachedImageBase64];
            chatContext.push(userMsgObj);
            saveHistory();

            userInput.value = '';
            sendBtn.disabled = true;
            typingIndicator.style.display = 'block';
            
            // 3. Send entire Chat Memory to the API Chat Endpoint
            const requestBody = {
                model: CLOUD_MODEL_NAME,
                messages: chatContext,
                stream: false
            };

            clearAttachment();

            try {
                const response = await fetch(VPS_OLLAMA_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                
                const data = await response.json();
                
                // 4. Read AI Response, add to memory, and render on screen
                const aiReply = data.message.content; // API/Chat returns this instead of data.response
                
                chatContext.push({ role: 'assistant', content: aiReply });
                saveHistory();
                
                addMessageVisual(aiReply, 'bot-message');

            } catch (error) {
                console.error('API Error:', error);
                // We pop the user's failed message out of memory so it doesn't confuse the AI later
                chatContext.pop(); 
                addMessageVisual(`⚠️ **API Error:** Could not connect. Please check your VPS.`, 'bot-message');
            } finally {
                sendBtn.disabled = false;
                typingIndicator.style.display = 'none';
                userInput.focus();
            }
        }

        // --- PURE VISUAL RENDERING ---
        function addMessageVisual(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            
            if (className === 'bot-message') {
                if (typeof marked !== 'undefined') {
                    msgDiv.innerHTML = marked.parse(text);
                } else { msgDiv.textContent = text; }
            } else {
                msgDiv.innerText = text;
            }
            
            chatContainer.appendChild(msgDiv);
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }
    </script>
</body>
</html>
