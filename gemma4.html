<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>AI Pro Coder</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        /* CSS Reset & Global Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --surface-hover: #333537;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #a8c7fa;
            --accent-blue-bg: rgba(168, 199, 250, 0.15);
            --border-color: #444746;
            --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: 100dvh; 
            overscroll-behavior-y: none; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Header */
        header { 
            background-color: rgba(19, 19, 20, 0.85); 
            backdrop-filter: blur(12px);
            padding: 12px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0; 
            z-index: 100; 
            position: sticky;
            top: 0;
            padding-top: calc(env(safe-area-inset-top, 16px) + 8px);
        }
        
        .header-title { flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        
        #model-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: transparent;
            border: none;
            padding: 8px 32px 8px 12px;
            font-size: 1.15rem;
            font-family: var(--font-main);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            outline: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c4c7c5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 18px;
            border-radius: 8px;
            max-width: 250px;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
        #model-select:hover { background-color: var(--surface-color); color: var(--text-primary); }
        #model-select option { background-color: var(--surface-color); color: var(--text-primary); }

        .header-btn { 
            background: transparent; color: var(--text-secondary); border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            padding: 8px; border-radius: 50%; transition: background-color 0.2s;
        }
        .header-btn:hover { background-color: var(--surface-color); color: var(--text-primary); }
        
        /* Sidebar */
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; opacity: 0; transition: opacity 0.3s ease; }
        #sidebar { 
            position: fixed; left: -300px; top: 0; width: 280px; height: 100dvh; 
            background: var(--surface-color); z-index: 200; 
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; flex-direction: column; 
            border-top-right-radius: 16px; border-bottom-right-radius: 16px;
            box-shadow: 2px 0 12px rgba(0,0,0,0.5);
        }
        #sidebar.open { left: 0; }
        .sidebar-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; padding-top: calc(env(safe-area-inset-top, 16px) + 16px); font-weight: 500; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); }
        #chat-list { flex-grow: 1; overflow-y: auto; padding: 12px; }
        
        .chat-item { padding: 12px 16px; margin-bottom: 6px; border-radius: 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .chat-item:hover { background-color: var(--surface-hover); }
        .chat-item.active { background-color: var(--accent-blue-bg); color: var(--accent-blue); font-weight: 500; }
        .chat-title { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; padding-right: 8px; }
        .chat-delete { background: none; border: none; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .chat-delete:hover { background-color: rgba(255,255,255,0.1); color: #f28b82; }

        /* Chat UI */
        #chat-wrapper { flex: 1 1 auto; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        #chat-container { 
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 20px 16px 140px; 
            -webkit-overflow-scrolling: touch;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            scroll-behavior: smooth;
        }

        .welcome-screen { text-align: center; margin-top: 25vh; display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.8s ease; }
        .welcome-title { font-size: 2.2rem; font-weight: 400; letter-spacing: -0.01em; color: #e3e3e3; margin-top: 16px; line-height: 1.3; }
        .welcome-subtitle { font-size: 1.1rem; color: var(--text-secondary); font-weight: 400; margin-top: 8px;}

        .message-row { display: flex; width: 100%; margin-bottom: 28px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .user-row { justify-content: flex-end; }
        .user-message { 
            background-color: var(--surface-color); 
            color: var(--text-primary); 
            border-radius: 24px; 
            padding: 14px 20px;
            font-size: 1.05rem;
            line-height: 1.5;
            max-width: 85%;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .bot-row { justify-content: flex-start; align-items: flex-start; gap: 16px; }
        .bot-avatar {
            flex-shrink: 0; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            margin-top: 2px;
        }
        .bot-message { 
            color: var(--text-primary); 
            width: 100%; max-width: calc(100% - 48px);
            font-size: 1.05rem; line-height: 1.65; word-break: break-word;
        }

        .bot-message p { margin-bottom: 14px; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin-left: 20px; margin-bottom: 14px; }
        .bot-message li { margin-bottom: 6px; }
        .bot-message strong { font-weight: 600; color: #ffffff; }
        .bot-message code:not(.hljs) { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background-color: var(--surface-color); padding: 3px 6px; border-radius: 6px; font-size: 0.9em; color: var(--accent-blue); }
        
        /* Code Blocks */
        .code-wrapper { margin: 16px 0; border-radius: 12px; overflow: hidden; background-color: #1e1f20; border: 1px solid var(--border-color); }
        .code-header { display: flex; justify-content: space-between; align-items: center; background-color: #282a2c; padding: 8px 16px; }
        .lang-label { color: #c4c7c5; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
        .btn-group { display: flex; gap: 8px; }
        .copy-btn { background-color: transparent; border: none; color: var(--accent-blue); border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; font-family: var(--font-main); cursor: pointer; transition: all 0.2s; font-weight: 500;}
        .copy-btn:hover { background-color: rgba(168, 199, 250, 0.1); }
        .copy-btn.copied { color: #81c995; }
        .preview-btn { color: #e3e3e3; background-color: rgba(255,255,255,0.05); }
        .preview-btn:hover { background-color: rgba(255,255,255,0.1); }
        
        .bot-message pre { margin: 0; padding: 16px; overflow: auto; max-height: 400px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.95rem; }
        .bot-message pre code { background-color: transparent; padding: 0; color: #e3e3e3; white-space: pre; }
        .bot-message table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin-bottom: 14px; }
        .bot-message th, .bot-message td { border: 1px solid var(--border-color); padding: 8px 12px; }
        .bot-message img { max-width: 100%; height: auto; border-radius: 12px; margin-top: 12px; border: 1px solid var(--border-color); }
        
        /* Input Area */
        #input-wrapper {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(19,19,20,1) 50%, rgba(19,19,20,0));
            padding: 16px; 
            padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 24px);
            display: flex; justify-content: center; pointer-events: none; z-index: 50;
        }

        #input-area { 
            background-color: var(--surface-color);
            border-radius: 32px;
            width: 100%; max-width: 820px;
            padding: 8px 8px 8px 16px;
            display: flex; gap: 8px; align-items: flex-end;
            pointer-events: auto;
            transition: background-color 0.3s;
        }
        
        #input-area:focus-within { background-color: #282a2c; }

        #user-input {
            flex: 1 1 auto; min-width: 0; min-height: 48px; max-height: 160px;
            padding: 12px 0; border: none; background: transparent;
            font-size: 1.1rem; line-height: 1.4; outline: none; resize: none;
            overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere;
            color: var(--text-primary); font-family: var(--font-main);
        }
        #user-input::placeholder { color: var(--text-secondary); opacity: 0.9; }
        
        .icon-btn { 
            background-color: transparent; color: var(--text-secondary); border: none; 
            width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; border-radius: 50%; transition: background 0.2s;
        }
        .icon-btn:hover { background-color: rgba(255,255,255,0.05); color: var(--text-primary); }
        
        .send-btn { 
            background-color: transparent; color: var(--text-secondary); border: none; 
            border-radius: 50%; width: 48px; height: 48px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
        }
        .send-btn.active { color: var(--bg-color); background-color: #e3e3e3; }
        .send-btn:disabled { color: #555; background-color: transparent; cursor: not-allowed; }
        
        #file-upload { opacity: 0; position: absolute; z-index: -1; width: 1px; height: 1px; }

        /* Utilities */
        .typing { display: flex; gap: 4px; padding: 12px 0; align-items: center; }
        .typing span { width: 6px; height: 6px; background: var(--accent-blue); border-radius: 50%; animation: pulse 1.5s infinite ease-in-out; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.4; } 50% { transform: scale(1.2); opacity: 1; } }

        #attachment-preview { 
            background-color: var(--surface-color); padding: 10px 16px; font-size: 0.95rem; 
            color: var(--text-primary); display: none; align-items: center; 
            justify-content: space-between; border-radius: 16px; margin: 0 16px 12px; 
            pointer-events: auto; font-weight: 500;
        }
        #attachment-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 8px; }
        .remove-attachment { color: var(--text-secondary); cursor: pointer; padding: 4px; border-radius: 50%; display: flex; }
        .remove-attachment:hover { background-color: rgba(255,255,255,0.05); color: var(--text-primary); }

        #toast {
            visibility: hidden; min-width: 250px; background-color: var(--text-primary); color: var(--bg-color);
            text-align: center; border-radius: 8px; padding: 12px 24px; position: fixed;
            z-index: 1000; left: 50%; top: 20px; transform: translateX(-50%); font-size: 0.95rem; font-weight: 500;
            opacity: 0; transition: opacity 0.3s, top 0.3s, visibility 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; top: 80px; }
        
        #canvas-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: var(--bg-color); z-index: 300; flex-direction: column; }
        #canvas-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--surface-color); padding-top: calc(env(safe-area-inset-top, 16px) + 12px); border-bottom: 1px solid var(--border-color);}
        #canvas-title { font-weight: 500; font-size: 1.1rem; color: var(--text-primary); }
        .close-canvas-btn { background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); padding: 6px 16px; border-radius: 16px; cursor: pointer; font-weight: 500; font-family: var(--font-main); transition: background 0.2s;}
        .close-canvas-btn:hover { background: var(--surface-hover); }
    </style>
</head>
<body>

    <header>
        <button class="header-btn" onclick="toggleSidebar()" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="header-title">
            <select id="model-select" onchange="changeModel()">
                <option value="">Loading models...</option>
            </select>
        </div>
        <button class="header-btn" onclick="startNewChat()" aria-label="New Chat">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
    </header>

    <div id="toast">Model switched!</div>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <span>Recent</span>
        </div>
        <div id="chat-list"></div>
    </div>

    <div id="chat-wrapper">
        <div id="chat-container"></div>
        
        <div id="input-wrapper">
            <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column;">
                
                <div id="attachment-preview">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    <span id="attachment-name">filename.txt</span>
                    <div class="remove-attachment" onclick="clearAttachment()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </div>
                </div>

                <div id="input-area">
                    <label class="icon-btn" for="file-upload">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </label>
                    
                    <input type="file" id="file-upload" multiple>
                    
                    <textarea id="user-input" placeholder="Ask AI Pro Coder" autocomplete="off" rows="1"></textarea>
                    
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: translateX(1px);"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-modal">
        <div id="canvas-header">
            <span id="canvas-title">Live Preview</span>
            <button class="close-canvas-btn" onclick="closeCanvas()">Close</button>
        </div>
        <iframe id="canvas-iframe" style="flex-grow: 1; border: none; width: 100%; background: #ffffff;"></iframe>
    </div>

    <script>
        const API_BASE_URL = 'https://aiproxy.th3va.com';
        const VPS_OLLAMA_URL = `${API_BASE_URL}/api/chat`;
        const VPS_OLLAMA_TAGS_URL = `${API_BASE_URL}/api/tags`;

        const STORAGE_MODEL_KEY = 'aiproxy_selected_model';
        const STORAGE_CONVERSATIONS_KEY = 'aiproxy_conversations';

        const SYSTEM_PROMPT = `
You are AI Pro Coder, an elite senior software engineer and AI architect.
Rules:
- Always provide production-grade solutions
- Never give incomplete code
- Generate full working scripts when requested
- Prefer clean architecture, mobile responsiveness, and performance
- When generating HTML/CSS/JS, provide complete standalone files
- Explain fixes clearly and briefly
`;

        let AVAILABLE_MODELS = {};
        let currentModel = '';
        let conversations = []; 
        let currentChatId = null; 
        let chatContext = []; 
        let toastTimeout = null;
        let isWaitingForReply = false;
        let currentBotMessageDiv = null; // Reference to the div being streamed into

        window.onload = async function() {
            await loadActiveModelsFromServer();
            const savedConversations = localStorage.getItem(STORAGE_CONVERSATIONS_KEY);
            if (savedConversations) {
                try { conversations = JSON.parse(savedConversations) || []; } catch (e) { conversations = []; }
            }
            if (conversations.length > 0) loadChat(conversations[0].id);
            else startNewChat();
        };

        function formatModelLabel(modelName) {
            return String(modelName || '')
                .replace(/:cloud$/i, ' Cloud')
                .replace(/:latest$/i, ' Latest')
                .replace(/-/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase())
                .trim();
        }

        function populateModelDropdown(modelsMap) {
            const modelSelect = document.getElementById('model-select');
            modelSelect.innerHTML = '';
            const modelEntries = Object.entries(modelsMap);
            if (modelEntries.length === 0) {
                modelSelect.innerHTML = '<option value="">No models found</option>';
                currentModel = '';
                return;
            }
            modelEntries.forEach(([modelId, label]) => {
                const option = document.createElement('option');
                option.value = modelId;
                option.textContent = label;
                modelSelect.appendChild(option);
            });
            const savedModel = localStorage.getItem(STORAGE_MODEL_KEY);
            if (savedModel && modelsMap[savedModel]) {
                currentModel = savedModel;
            } else if (!currentModel || !modelsMap[currentModel]) {
                currentModel = modelEntries[0][0];
                localStorage.setItem(STORAGE_MODEL_KEY, currentModel);
            }
            modelSelect.value = currentModel;
        }

        async function loadActiveModelsFromServer() {
            const modelSelect = document.getElementById('model-select');
            modelSelect.innerHTML = '<option value="">Loading models...</option>';
            modelSelect.disabled = true;
            currentModel = '';
            const requestUrl = `${VPS_OLLAMA_TAGS_URL}?t=${Date.now()}`;
            try {
                const response = await fetch(requestUrl, { method: 'GET', mode: 'cors', headers: { 'Accept': 'application/json' }, cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const serverModels = Array.isArray(data.models) ? data.models : [];
                const activeModels = {};
                serverModels.forEach(item => {
                    const modelId = item.name || item.model;
                    if (modelId) activeModels[modelId] = formatModelLabel(modelId);
                });
                if (Object.keys(activeModels).length === 0) throw new Error('No models returned');
                AVAILABLE_MODELS = activeModels;
                populateModelDropdown(AVAILABLE_MODELS);
                modelSelect.disabled = false;
            } catch (error) {
                console.error('Model loading failed:', error);
                AVAILABLE_MODELS = {};
                currentModel = '';
                localStorage.removeItem(STORAGE_MODEL_KEY);
                modelSelect.innerHTML = `<option value="">Unable to load models</option><option value="__retry__">Retry</option>`;
                modelSelect.disabled = false;
                showToast('Unable to load models from VPS');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function changeModel() {
            currentModel = document.getElementById('model-select').value;
            if (currentModel === '__retry__') { loadActiveModelsFromServer(); return; }
            if (!currentModel) { localStorage.removeItem(STORAGE_MODEL_KEY); return; }
            localStorage.setItem(STORAGE_MODEL_KEY, currentModel);
            const modelName = AVAILABLE_MODELS[currentModel] || currentModel;
            showToast(`Switched to ${modelName}`);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);
            } else {
                sidebar.classList.add('open');
                overlay.style.display = 'block';
                setTimeout(() => overlay.style.opacity = '1', 10);
            }
        }

        function escapeHtml(value) {
            return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function renderSidebar() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            conversations.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.onclick = () => loadChat(chat.id);
                div.innerHTML = `
                    <div class="chat-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 6px; opacity: 0.7"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        ${escapeHtml(chat.title)}
                    </div>
                    <button class="chat-delete" onclick="deleteChat('${chat.id}', event)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function renderWelcomeScreen() {
            document.getElementById('chat-container').innerHTML = `
                <div class="welcome-screen">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="url(#sparkle-grad)" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#4285f4"/>
                                <stop offset="50%" stop-color="#d96570"/>
                                <stop offset="100%" stop-color="#f4b400"/>
                            </linearGradient>
                        </defs>
                        <path d="M12.0001 22.5001C11.854 22.5001 11.7161 22.4276 11.6366 22.3023C9.9392 19.5898 7.64998 17.3006 4.93751 15.6032C4.81223 15.5237 4.73975 15.3858 4.73975 15.2397V15.2397C4.73975 15.0936 4.81223 14.9557 4.93751 14.8762C7.64998 13.1788 9.9392 10.8896 11.6366 8.17714C11.7161 8.05185 11.854 7.97937 12.0001 7.97937V7.97937C12.1462 7.97937 12.284 8.05185 12.3636 8.17714C14.061 10.8896 16.3502 13.1788 19.0627 14.8762C19.188 14.9557 19.2604 15.0936 19.2604 15.2397V15.2397C19.2604 15.3858 19.188 15.5237 19.0627 15.6032C16.3502 17.3006 14.061 19.5898 12.3636 22.3023C12.284 22.4276 12.1462 22.5001 12.0001 22.5001V22.5001Z"/>
                        <path d="M19.0001 8.50013C18.854 8.50013 18.7161 8.42765 18.6366 8.30237C17.6521 6.72911 16.321 5.4005 14.7475 4.41846C14.6222 4.33897 14.5498 4.20108 14.5498 4.05498V4.05498C14.5498 3.90888 14.6222 3.77099 14.7475 3.69151C16.321 2.70947 17.6521 1.38086 18.6366 -0.192398C18.7161 -0.317684 18.854 -0.390167 19.0001 -0.390167V-0.390167C19.1462 -0.390167 19.284 -0.317684 19.3636 -0.192398C20.348 1.38086 21.6791 2.70947 23.2527 3.69151C23.378 3.77099 23.4504 3.90888 23.4504 4.05498V4.05498C23.4504 4.20108 23.378 4.33897 23.2527 4.41846C21.6791 5.4005 20.348 6.72911 19.3636 8.30237C19.284 8.42765 19.1462 8.50013 19.0001 8.50013V8.50013Z" />
                    </svg>
                    <h1 class="welcome-title">Hi Developer,<br>what's on your mind?</h1>
                </div>
            `;
        }

        function startNewChat() {
            currentChatId = null;
            chatContext = [{ role: 'system', content: SYSTEM_PROMPT }];
            renderWelcomeScreen();
            if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
            renderSidebar();
        }

        function loadChat(id) {
            const chatToLoad = conversations.find(c => c.id === id);
            if (!chatToLoad) return;
            currentChatId = id;
            chatContext = [...chatToLoad.messages];
            document.getElementById('chat-container').innerHTML = '';
            let hasMessages = false;
            chatContext.forEach(msg => {
                if (msg.role !== 'system') {
                    hasMessages = true;
                    addMessageVisual(msg.content, msg.role === 'user' ? 'user-message' : 'bot-message');
                }
            });
            if (!hasMessages) renderWelcomeScreen();
            if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
            renderSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation(); 
            if (!confirm("Delete this conversation forever?")) return;
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem(STORAGE_CONVERSATIONS_KEY, JSON.stringify(conversations));
            if (currentChatId === id) startNewChat(); else renderSidebar();
        }

        function saveHistory() {
            const safeContext = chatContext.map(msg => ({ role: msg.role, content: msg.content }));
            if (!currentChatId) {
                currentChatId = Date.now().toString();
                const firstUserMsg = safeContext.find(m => m.role === 'user');
                let title = firstUserMsg ? firstUserMsg.content.substring(0, 30) + '...' : 'New Chat';
                conversations.unshift({ id: currentChatId, title: title, messages: safeContext });
            } else {
                const index = conversations.findIndex(c => c.id === currentChatId);
                if (index !== -1) conversations[index].messages = safeContext;
            }
            localStorage.setItem(STORAGE_CONVERSATIONS_KEY, JSON.stringify(conversations));
            renderSidebar(); 
        }

        const renderer = new marked.Renderer();
        renderer.code = function({text, lang}) {
            const validLanguage = hljs.getLanguage(lang) ? lang : 'plaintext';
            const highlightedCode = hljs.highlight(text, { language: validLanguage }).value;
            let previewBtnHTML = '';
            if (lang === 'html' || lang === 'xml') {
                previewBtnHTML = `<button class="copy-btn preview-btn" onclick="openCanvas(this)">Preview Canvas</button>`;
            }
            return `
                <div class="code-wrapper">
                    <div class="code-header">
                        <span class="lang-label">${validLanguage}</span>
                        <div class="btn-group">${previewBtnHTML}<button class="copy-btn" onclick="copyCode(this)">Copy code</button></div>
                    </div>
                    <pre><code class="hljs ${validLanguage}">${highlightedCode}</code></pre>
                </div>`;
        };
        marked.setOptions({ renderer: renderer });

        window.openCanvas = function(button) {
            const pre = button.parentElement.parentElement.nextElementSibling;
            const doc = document.getElementById('canvas-iframe').contentWindow.document;
            document.getElementById('canvas-modal').style.display = 'flex';
            doc.open(); doc.write(pre.textContent); doc.close();
        };

        window.closeCanvas = function() {
            document.getElementById('canvas-modal').style.display = 'none';
            document.getElementById('canvas-iframe').src = 'about:blank'; 
        };

        window.copyCode = function(button) {
            const codeText = button.parentElement.parentElement.nextElementSibling.textContent;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(codeText).catch(() => fallbackCopy(codeText, button));
            } else { fallbackCopy(codeText, button); }
            const originalText = button.textContent;
            button.textContent = 'Copied!'; button.classList.add('copied');
            setTimeout(() => { button.textContent = originalText; button.classList.remove('copied'); }, 2000);
        };

        function fallbackCopy(text, button) {
            let textArea = document.createElement("textarea"); textArea.value = text;
            textArea.style.top = "0"; textArea.style.left = "0"; textArea.style.position = "fixed";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand("copy"); } catch (err) {} textArea.remove();
        }

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-upload');
        const attachmentPreview = document.getElementById('attachment-preview');
        const attachmentName = document.getElementById('attachment-name');

        let attachedFiles = []; 

        document.body.addEventListener('touchmove', function(e) {
            const canvasModal = document.getElementById('canvas-modal');
            const sidebarModal = document.getElementById('sidebar-overlay');
            if (canvasModal.style.display !== 'flex' && sidebarModal.style.display !== 'block' && !chatContainer.contains(e.target) && !document.getElementById('sidebar').contains(e.target)) {
                e.preventDefault();
            }
        }, { passive: false });

        fileInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            attachmentPreview.style.display = 'flex';
            attachmentName.textContent = 'Loading files...';
            const filePromises = files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onerror = () => { resolve({ name: file.name, type: 'text', content: '[Error reading file]' }); };
                    if (file.type.startsWith('image/')) {
                        reader.onload = function(event) { resolve({ name: file.name, type: 'image', content: event.target.result.split(',')[1] }); };
                        reader.readAsDataURL(file);
                    } else {
                        reader.onload = function(event) { resolve({ name: file.name, type: 'text', content: event.target.result }); };
                        reader.readAsText(file);
                    }
                });
            });
            attachedFiles = await Promise.all(filePromises);
            attachmentName.textContent = attachedFiles.map(f => f.name).join(', ');
            updateSendButtonState();
        });

        function clearAttachment() {
            fileInput.value = ''; 
            attachedFiles = []; 
            attachmentPreview.style.display = 'none';
            updateSendButtonState();
        }

        function autoResizeInput() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
            updateSendButtonState();
        }

        function updateSendButtonState() {
            if (userInput.value.trim() !== '' || attachedFiles.length > 0) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        }

        userInput.addEventListener('input', autoResizeInput);
        userInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function removeWelcomeScreen() {
            const welcomeScreen = document.querySelector('.welcome-screen');
            if (welcomeScreen) welcomeScreen.remove();
        }

        // STREAMING IMPLEMENTATION
        async function sendMessage() {
            if (isWaitingForReply) return;
            let text = userInput.value.trim();
            if (!text && attachedFiles.length === 0) return;
            if (!currentModel) {
                showToast('No active model available.');
                return;
            }

            removeWelcomeScreen();
            isWaitingForReply = true;
            sendBtn.disabled = true;
            sendBtn.classList.remove('active');

            let displayMessage = text;
            if (attachedFiles.length > 0) {
                const namesList = attachedFiles.map(f => f.name).join(', ');
                displayMessage += displayMessage ? `\n\n[Attached: ${namesList}]` : `[Attached: ${namesList}]`;
            }

            addMessageVisual(displayMessage, 'user-message');
            
            let finalPrompt = text;
            const textFiles = attachedFiles.filter(f => f.type === 'text');
            if (textFiles.length > 0) {
                textFiles.forEach(f => {
                    finalPrompt += `\n\n--- FILE CONTENTS (${f.name}) ---\n${f.content}`;
                });
            }

            let userMsgObj = { role: 'user', content: finalPrompt || 'Please review these files.' };
            const imageFiles = attachedFiles.filter(f => f.type === 'image');
            if (imageFiles.length > 0) {
                userMsgObj.images = imageFiles.map(f => f.content);
            }
            
            chatContext.push(userMsgObj);
            saveHistory(); 

            userInput.value = '';
            autoResizeInput();
            
            const typingRowId = `typing-${Date.now()}`;
            addTypingIndicator(typingRowId);

            // Prepare Bot Message Container for Streaming
            currentBotMessageDiv = document.createElement('div');
            currentBotMessageDiv.className = 'bot-message';
            const botRow = document.createElement('div');
            botRow.className = 'message-row bot-row';
            botRow.innerHTML = `
                <div class="bot-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="url(#sparkle-grad)" xmlns="http://www.w3.org/2000/svg">
                        <defs><linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4285f4"/><stop offset="50%" stop-color="#d96570"/><stop offset="100%" stop-color="#f4b400"/></linearGradient></defs>
                        <path d="M12.0001 22.5001C11.854 22.5001 11.7161 22.4276 11.6366 22.3023C9.9392 19.5898 7.64998 17.3006 4.93751 15.6032C4.81223 15.5237 4.73975 15.3858 4.73975 15.2397V15.2397C4.73975 15.0936 4.81223 14.9557 4.93751 14.8762C7.64998 13.1788 9.9392 10.8896 11.6366 8.17714C11.7161 8.05185 11.854 7.97937 12.0001 7.97937V7.97937C12.1462 7.97937 12.284 8.05185 12.3636 8.17714C14.061 10.8896 16.3502 13.1788 19.0627 14.8762C19.188 14.9557 19.2604 15.0936 19.2604 15.2397V15.2397C19.2604 15.3858 19.188 15.5237 19.0627 15.6032C16.3502 17.3006 14.061 19.5898 12.3636 22.3023C12.284 22.4276 12.1462 22.5001 12.0001 22.5001V22.5001Z"/>
                    </svg>
                </div>`;
            botRow.appendChild(currentBotMessageDiv);
            document.getElementById('chat-container').appendChild(botRow);
            scrollToBottom();

            const requestBody = {
                model: currentModel,
                messages: chatContext,
                stream: true // Enable Streaming
            };

            clearAttachment();

            const controller = new AbortController();
            // Mobile networks can be slow, give it 5 mins
            const timeoutId = setTimeout(() => controller.abort(), 300000); 

            let fullResponseText = "";

            try {
                const response = await fetch(VPS_OLLAMA_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                removeTypingIndicator(typingRowId);

                if (!response.ok) {
                    const errorJson = await response.json().catch(() => ({}));
                    throw new Error(errorJson.error || `HTTP Error ${response.status}`);
                }
                
                // HANDLE STREAM
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const json = JSON.parse(line);
                            if (json.message && json.message.content) {
                                const content = json.message.content;
                                fullResponseText += content;
                                // Update UI incrementally
                                currentBotMessageDiv.innerHTML = marked.parse(fullResponseText);
                                // Re-highlight code blocks
                                currentBotMessageDiv.querySelectorAll('pre code').forEach((block) => {
                                    hljs.highlightElement(block);
                                });
                                scrollToBottom();
                            }
                            if (json.done) {
                                // Stream finished
                                break;
                            }
                        } catch (e) {
                            console.warn("Error parsing stream chunk", e);
                        }
                    }
                }

                chatContext.push({ role: 'assistant', content: fullResponseText });
                saveHistory();

            } catch (error) {
                console.error('API Error:', error);
                // Remove partial message if error occurs early
                if(currentBotMessageDiv) currentBotMessageDiv.remove();
                
                if (error.name === 'AbortError') {
                    addMessageVisual(`⚠️ **Timeout Error:** The model took too long.`, 'bot-message');
                } else {
                    addMessageVisual(`⚠️ **API Error:** ${error.message}`, 'bot-message');
                }
            } finally {
                sendBtn.disabled = false;
                isWaitingForReply = false;
                userInput.focus();
                updateSendButtonState();
                currentBotMessageDiv = null;
            }
        }

        function addTypingIndicator(id) {
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row bot-row`;
            rowDiv.id = id;
            rowDiv.innerHTML = `
                <div class="bot-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="url(#sparkle-grad)" xmlns="http://www.w3.org/2000/svg">
                        <defs><linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4285f4"/><stop offset="50%" stop-color="#d96570"/><stop offset="100%" stop-color="#f4b400"/></linearGradient></defs>
                        <path d="M12.0001 22.5001C11.854 22.5001 11.7161 22.4276 11.6366 22.3023C9.9392 19.5898 7.64998 17.3006 4.93751 15.6032C4.81223 15.5237 4.73975 15.3858 4.73975 15.2397V15.2397C4.73975 15.0936 4.81223 14.9557 4.93751 14.8762C7.64998 13.1788 9.9392 10.8896 11.6366 8.17714C11.7161 8.05185 11.854 7.97937 12.0001 7.97937V7.97937C12.1462 7.97937 12.284 8.05185 12.3636 8.17714C14.061 10.8896 16.3502 13.1788 19.0627 14.8762C19.188 14.9557 19.2604 15.0936 19.2604 15.2397V15.2397C19.2604 15.3858 19.188 15.5237 19.0627 15.6032C16.3502 17.3006 14.061 19.5898 12.3636 22.3023C12.284 22.4276 12.1462 22.5001 12.0001 22.5001V22.5001Z"/>
                    </svg>
                </div>
                <div class="typing" style="padding-left: 12px;">
                    <span></span><span></span><span></span>
                </div>
            `;
            document.getElementById('chat-container').appendChild(rowDiv);
            scrollToBottom();
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function addMessageVisual(text, className) {
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row ${className === 'bot-message' ? 'bot-row' : 'user-row'}`;
            
            let innerHtml = '';
            if (className === 'bot-message') {
                innerHtml += `
                <div class="bot-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="url(#sparkle-grad)" xmlns="http://www.w3.org/2000/svg">
                        <defs><linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4285f4"/><stop offset="50%" stop-color="#d96570"/><stop offset="100%" stop-color="#f4b400"/></linearGradient></defs>
                        <path d="M12.0001 22.5001C11.854 22.5001 11.7161 22.4276 11.6366 22.3023C9.9392 19.5898 7.64998 17.3006 4.93751 15.6032C4.81223 15.5237 4.73975 15.3858 4.73975 15.2397V15.2397C4.73975 15.0936 4.81223 14.9557 4.93751 14.8762C7.64998 13.1788 9.9392 10.8896 11.6366 8.17714C11.7161 8.05185 11.854 7.97937 12.0001 7.97937V7.97937C12.1462 7.97937 12.284 8.05185 12.3636 8.17714C14.061 10.8896 16.3502 13.1788 19.0627 14.8762C19.188 14.9557 19.2604 15.0936 19.2604 15.2397V15.2397C19.2604 15.3858 19.188 15.5237 19.0627 15.6032C16.3502 17.3006 14.061 19.5898 12.3636 22.3023C12.284 22.4276 12.1462 22.5001 12.0001 22.5001V22.5001Z"/>
                    </svg>
                </div>`;
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            
            if (className === 'bot-message') {
                if (typeof marked !== 'undefined') {
                    msgDiv.innerHTML = marked.parse(text);
                } else { msgDiv.textContent = text; }
            } else {
                msgDiv.innerText = text;
            }
            
            rowDiv.innerHTML = innerHtml;
            rowDiv.appendChild(msgDiv);
            document.getElementById('chat-container').appendChild(rowDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => { 
                const container = document.getElementById('chat-container');
                container.scrollTop = container.scrollHeight; 
            }, 50);
        }
    </script>
</body>
</html>
