<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemma 4 Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f4f7; display: flex; flex-direction: column; height: 100vh; overscroll-behavior-y: none; }
        
        /* Header */
        header { background-color: #ffffff; padding: 16px; text-align: center; border-bottom: 1px solid #e5e5ea; font-weight: 600; font-size: 1.1rem; color: #1c1c1e; flex-shrink: 0; }
        
        /* Chat Container */
        #chat-container { flex-grow: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-message { align-self: flex-end; background-color: #007aff; color: white; border-bottom-right-radius: 4px; }
        .bot-message { align-self: flex-start; background-color: #e5e5ea; color: black; border-bottom-left-radius: 4px; }
        
        /* Loading Indicator */
        .typing { font-style: italic; color: #8e8e93; font-size: 0.85rem; align-self: flex-start; display: none; margin-top: -8px; padding-left: 16px; }

        /* Input Area */
        #input-area { background-color: #ffffff; padding: 12px 16px; border-top: 1px solid #e5e5ea; display: flex; gap: 8px; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom, 12px); }
        input[type="text"] { flex-grow: 1; padding: 12px 16px; border: 1px solid #c7c7cc; border-radius: 24px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #007aff; }
        button { background-color: #007aff; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        button:active { background-color: #005bb5; }
        button:disabled { background-color: #a1c8ff; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>Gemma 4 Server</header>

    <div id="chat-container">
        <div class="message bot-message">System online. Connected to VPS. How can I help you?</div>
    </div>
    <div class="typing" id="typing-indicator">Gemma is typing...</div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Message Gemma..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Replace with your VPS IP, or your Ngrok/HTTPS URL (See Phase 3 below)
        const VPS_OLLAMA_URL = 'http://YOUR_VPS_IP_ADDRESS:11434/api/generate'; 
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        // Allow pressing Enter on the keyboard to send
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add User Message to UI
            addMessage(text, 'user-message');
            userInput.value = '';
            
            // 2. Lock input and show loading
            sendBtn.disabled = true;
            typingIndicator.style.display = 'block';

            try {
                // 3. Send Request to VPS Backend
                const response = await fetch(VPS_OLLAMA_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'gemma4:e2b',
                        prompt: text,
                        stream: false
                    })
                });

                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // 4. Add Bot Message to UI
                addMessage(data.response, 'bot-message');

            } catch (error) {
                console.error('Error:', error);
                addMessage('Connection error. Is the VPS running and CORS configured?', 'bot-message');
            } finally {
                // 5. Unlock input
                sendBtn.disabled = false;
                typingIndicator.style.display = 'none';
                userInput.focus();
            }
        }

        function addMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
