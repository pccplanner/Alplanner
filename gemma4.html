<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World | AI Pro Coder</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for easy theme management */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 0.15);
            --glass-border: rgba(255, 0.2);
            --text-color: #ffffff;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--primary-gradient);
            overflow: hidden;
            color: var(--text-color);
        }

        /* Animated Background Shapes for depth */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(25, 25, 0.1);
            z-index: -1;
            animation: float 10s infinite alternate;
        }
        .circle-1 { width: 300px; height: 300px; top: -10%; left: -10%; }
        .circle-2 { width: 200px; height: 20px; bottom: -5%; right: -5%; animation-delay: 2s; }

        @keyframes float {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }

        /* Glassmorphism Card */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 3rem 5rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: var(--transition);
            cursor: pointer;
            max-width: 90%;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(25, 25, 0.2);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards 0.2s;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.8;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards 0.4s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }

        /* Interactive element */
        .btn {
            margin-top: 2rem;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #764ba2;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0;
            animation: fadeInUp 0.6s forwards 0.6s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <!-- Main Content -->
    <div class="card" id="mainCard">
        <h1 id="greeting">Hello World!</h1>
        <p>Welcome to a production-grade simple page.</p>
        <button class="btn" onclick="changeGreeting()">Click Me</button>
    </div>

    <script>
        /**
         * Logic to handle greeting change
         * Demonstrates basic DOM manipulation
         */
        function changeGreeting() {
            const greeting = document.getElementById('greeting');
            const currentText = greeting.innerText;
            
            greeting.innerText = currentText === "Hello World!" 
                ? "Hello Universe! 🚀" 
                : "Hello World!";
            
            // Trigger a small CSS pop effect via JS
            greeting.style.transform = 'scale(1.1)';
            setTimeout(() => {
                greeting.style.transform = 'scale(1)';
            }, 200);
        }

        // Log initialization for debugging
        console.log("AI Pro Coder: Hello Page initialized successfully.");
    </script>
</body>
</html>
